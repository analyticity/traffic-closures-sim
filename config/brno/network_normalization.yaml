# Network normalization: Brno-specific overrides.
# Speed/lanes/capacity defaults for Czech link types are built into the code
# (see defaults.py NETWORK_NORM_DEFAULTS).
# This file only needs experiment_profiles with city-specific overrides.

experiment_profiles:
  baseline:
    # OSM misclassification fixes: some major corridors are tagged as
    # secondary in OSM but carry trunk-level AADT.  Reclassify before
    # speed/capacity defaults are applied so they get trunk parameters.
    link_type_overrides:
      - match: {osm_ref_norm: "640"}
        set_link_type: trunk
        min_speed: 80
        comment: "Zabovreska corridor (II/640) — 50k AADT, misclassified as secondary in OSM"
      - match: {osm_ref_norm: "41", link_type: "primary"}
        set_link_type: trunk
        min_speed: 60
        comment: "I/41 urban trunk — OSM tags as primary, CSD classifies as trunk"
      - match: {osm_ref_norm: "52", link_type: "secondary"}
        set_link_type: primary
        min_speed: 60
        comment: "I/52 urban section — 27k AADT, same corridor as trunk I/52"

    speed_caps:
      trunk: 80.0
      trunk_link: 60.0
      primary: 60.0
      primary_link: 50.0
      secondary: 50.0
      secondary_link: 40.0
      tertiary: 40.0
      tertiary_link: 35.0
      residential: 30.0
      service: 35.0
    speed_floors:
      service: 25.0
    time_penalties:
      trunk: 2.0
      trunk_link: 4.0
      primary: 3.0
      primary_link: 5.0
      secondary: 5.0
      secondary_link: 5.0
      tertiary: 7.0
      tertiary_link: 6.0
      residential: 6.0
