# Network normalization: experiment profiles.
# Speed/lanes/capacity defaults for Czech link types are built into the code
# (see _DEFAULT_*_BY_LINK_TYPE in network_normalization.py).
# This file only needs experiment_profiles with city-specific overrides.

experiment_profiles:
  baseline:
    # OSM misclassification fixes: some major corridors are tagged as
    # secondary in OSM but carry trunk-level AADT.  Reclassify before
    # speed/capacity defaults are applied so they get trunk parameters.
    link_type_overrides:
      - match: {osm_ref_norm: "640"}
        set_link_type: trunk
        min_speed: 80
        comment: "Zabovreska corridor (II/640) — 50k AADT, misclassified as secondary in OSM"

    speed_caps:
      trunk: 90.0
      trunk_link: 60.0
      primary: 70.0
      primary_link: 50.0
      secondary: 50.0
      secondary_link: 40.0
      tertiary: 40.0
      tertiary_link: 35.0
      residential: 30.0
      service: 35.0
    speed_floors:
      trunk: 70.0
      primary: 55.0
      service: 25.0
    time_penalties:
      trunk: 2.0
      trunk_link: 4.0
      primary: 3.0
      primary_link: 5.0
      secondary: 5.0
      secondary_link: 5.0
      tertiary: 7.0
      tertiary_link: 6.0
      residential: 6.0
