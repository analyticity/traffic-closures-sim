# Manual screenline definitions for inner-city corridors.
#
# Gateway screenlines (D1, D2, I/43, I/52, ...) and high-AADT CSD roads
# (640, 42, ...) are auto-generated via calibration.auto_screenlines.
#
# Only corridors matched by OSM street *name* (not osm_ref_norm) need
# manual definitions here, because auto-generation cannot create them.
#
# direction: 1 = a→b only, -1 = b→a only, 0 = both directions summed
# type: "screenline" | "cordon" | "radial"
# expected_links: optional sanity check — warns if resolved count differs

screenlines:

  - name: "Koliste_radial"
    description: "Koliště/Příkop inner ring road cross-section (bidirectional pair)"
    type: "radial"
    observed_aadt_cars: 46000
    observed_aadt_all: 52900
    geometry_wkt: "LINESTRING(16.6140 49.1970, 16.6170 49.1930)"
    filter:
      name: "Koliště,Příkop"
    expected_links: 2

  - name: "Dornych_radial"
    description: "Dornych primary corridor (south-east radial, dual carriageway)"
    type: "radial"
    observed_aadt_cars: 38000
    observed_aadt_all: 43700
    geometry_wkt: "LINESTRING(16.6140 49.1920, 16.6200 49.1870)"
    filter:
      name: "Dornych"
    expected_links: 2

  - name: "Krenova_radial"
    description: "Křenová tertiary corridor (east-west through centre, dual carriageway)"
    type: "radial"
    observed_aadt_cars: 22000
    observed_aadt_all: 25300
    geometry_wkt: "LINESTRING(16.6220 49.1900, 16.6260 49.1925)"
    filter:
      name: "Křenová"
    expected_links: 2

  - name: "Kounicova"
    description: "Kounicova tertiary corridor (inner city, pentlogram)"
    type: "radial"
    observed_aadt_cars: 11000
    observed_aadt_all: 12650
    geometry_wkt: "LINESTRING(16.5910 49.2115, 16.5945 49.2125)"
    filter:
      name: "Kounicova"
    expected_links: 2
