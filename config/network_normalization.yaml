# Network normalization defaults and experiment profiles for `python run.py normalize-network`.
#
# Data sources (see README "normalize-network"):
# - Primary link speeds/lanes: OpenStreetMap (maxspeed, lanes, …) via AequilibraE create_from_osm;
#   this file fills gaps by OSM highway / link_type.
# - capacity_per_lane_by_link_type: see "Capacities" below.
#
# --- Czech Republic (ČR) context — zákon č. 361/2000 Sb. (silniční provoz) ---
# Statutory *default* limits (osobní automobil, bez značky) are mainly tied to **place context**:
#   - v obci (built-up): obvykle 50 km/h na běžné komunikaci;
#   - mimo obec: 90 km/h na silnici;
#   - dálnice: nejvýše 130 km/h;
#   - obytná zóna (ČR): 20 km/h — v OSM spíš `highway=living_street` nebo značená zóna, **ne** `residential`.
#     `highway=residential` = běžné přístupové ulice v zástavbě (typicky limit v obci 50 km/h bez značky).
# OSM `highway=*` alone does **not** encode „v obci vs. mimo obec“, so any table by link_type is only
# a heuristic. For a legally defensible model, prefer tagged `maxspeed` (and `zone`) in OSM; these
# defaults only fill missing attributes.
# Values like primary: 70 or tertiary: 40 are **modeling compromises**, not a direct transcription
# of one ČR limit — they sit between urban 50 and interurban 90 where the importer gives no tag.
#
# --- Capacities (are they computed correctly?) ---
# - `capacity_ab` / `capacity_ba` in the DB are **total veh/h in that travel direction** (sum over all
#   lanes serving A→B or B→A). AequilibraE expands each network link into directed arcs and picks
#   `capacity_ab` for the forward arc and `capacity_ba` for the reverse; **one-way links** only expose
#   the allowed direction, so the unused directional capacity is not used in assignment.
# - If capacity is missing or zero, we set:  capacity_dir = capacity_per_lane × lanes_dir  for each
#   direction. YAML entries are therefore **veh/h per directional lane**, not for the whole roadway
#   cross-section.
# - The table is **HCM-order-of-magnitude** / uninterrupted-flow style, not a full signalised-intersection
#   capacity model. Urban links with semafory often have **lower effective** capacity per lane than the
#   same `highway` class in rural use; this stack partly compensates via **extra travel-time multipliers**
#   on lower classes during assignment (`assignment.py`), but capacity vs. delay is still a heuristic.
# - For ČR there is no mandatory “capacity table” in TP that maps 1:1 to OSM; treat values as
#   **calibration knobs** (e.g. against Pentlogram / řízení intenzit) if you need absolute flows.

normalization:
  thresholds:
    min_speed_kmh: 5.0
    min_capacity_vph: 50.0
    # Unknown link type: align with ČR default inside obce (50); rural untagged links should carry maxspeed in OSM.
    fallback_speed_kmh: 50.0
    generic_capacity_per_lane: 900
    min_travel_time_s: 0.01

  defaults:
    speed_by_link_type:
      motorway: 130.0
      motorway_link: 80.0
      trunk: 90.0
      trunk_link: 70.0
      primary: 70.0
      primary_link: 50.0
      secondary: 50.0
      secondary_link: 40.0
      tertiary: 40.0
      tertiary_link: 35.0
      unclassified: 35.0
      road: 35.0
      # OSM residential ≠ právní „obytná zóna“; to jsou běžné obytné ulice → v obci typicky 50 km/h.
      residential: 50.0
      service: 20.0
      # Blíží se obytné zóně / zklidněné ulici (ČR často 20 km/h).
      living_street: 20.0

    lanes_by_link_type:
      motorway: 3
      motorway_link: 2
      trunk: 2
      trunk_link: 2
      primary: 2
      primary_link: 1
      secondary: 1
      secondary_link: 1
      tertiary: 1
      tertiary_link: 1
      unclassified: 1
      road: 1
      residential: 1
      service: 1
      living_street: 1

    # veh/h per *directional* lane; total direction capacity = value × lanes_ab or × lanes_ba.
    # Key order matters (motorway_link before motorway, …).
    capacity_per_lane_by_link_type:
      motorway_link: 1800
      motorway: 2200
      trunk_link: 1500
      trunk: 1800
      primary_link: 1100
      primary: 1400
      secondary_link: 850
      secondary: 1000
      tertiary_link: 650
      tertiary: 800
      unclassified: 600
      road: 600
      residential: 500
      service: 300
      living_street: 150

