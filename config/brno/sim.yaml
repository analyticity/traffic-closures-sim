project_path: "project/brno_aeq"

# Externí brány a supernetwork jen pro dálnice (motorway) a rychlostní silnice (trunk).
# Konkrétní koridory přes hranici AOI: viz poslední gateway_diagnostics.csv v outputs/brno/…
supernetwork:
  eligible_gateway_types:
    - motorway
    - motorway_link
    - trunk
    - trunk_link

osm:
  place_name: "Brno, Czechia"

network:
  normalization_config: "config/brno/network_normalization.yaml"

zoning:
  sources:
    - type: osm
      place: "Okres Brno-město, Czechia"
      admin_level: "9"
    - type: osm
      place: "Okres Brno-venkov, Czechia"
      admin_level: "9"
  external_gateways:
    enabled: true

demand:
  segments:
    external_local:
      total_daily_trips: 130000
  sldb:
    external_processing:
      through_traffic_scale: 0.30

calibration:
  gateway_calibration:
    damping: 0.26
    min_factor: 0.55
    max_factor: 1.45
    # Doplňkový cíl pro gateway kalibraci: I/50 (trunk) u východní brány D1 — pozorovaný provoz
    # na krátkém koridoru (CSD) vs součet modelovaných objemů na vybraných linkách.
    # Škáluje OD řádky/sloupce pro externí zónu D1_E (I/50 je se sloučením v D1_E).
    # link_id z posledního měření v UI; směr 1 = AB u one-way trunk.
    corridor_observed:
      - gateway_name: D1_E
        observed_aadt: 14172.0
        link_ids: [29215, 51596]
        link_directions:
          "29215": 1
          "51596": 1
  odme:
    max_outer_iterations: 32
    entropy_step_size: 0.22
    convergence_tol: 0.0008
    assign_max_iter: 80
    stages:
      - name: "stabilize"
        max_iterations: 15
      - name: "refine"
        max_iterations: 25
  screenlines_path: "config/brno/screenlines.yaml"
  # Vyloučení CSD ``sil`` z per-road validace a z auto ``auto_csd_*`` screenlines
  # (okrajové úseky / špatně párovatelné na síť — viz měření v UI).
  matching:
    csd_validation_exclude_sil: ["23", "3846"]

datasets:
  enabled: true
  sources:
    commuting_sldb2021:
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Brno-město", "Brno-venkov"]
            - field: "op_orp"
              values: ["Brno"]
        destination:
          keep_all: true
    calibration_brno_pentlogram_2024:
      enabled: false
    validation_csd2025_v2:
      usage:
        area_filter: { enabled: true, region_hint: "Jihomoravský kraj" }

baseline_closures:
  enabled: false
  matching:
    max_distance_m: 50
    require_road_ref_match: true
