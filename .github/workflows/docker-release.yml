name: Docker Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      city:
        description: "City to build (leave empty for all)"
        required: false
        type: choice
        options:
          - all
          - brno
          - olomouc
          - most
        default: all

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/simulation

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        city: [brno, olomouc, most]

    steps:
      - name: Check if city should be built
        id: guard
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] \
             || [[ "${{ github.event.inputs.city }}" == "all" ]] \
             || [[ "${{ github.event.inputs.city }}" == "${{ matrix.city }}" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == 'false'

      - name: Restore data sources cache
        if: steps.guard.outputs.skip == 'false'
        id: sources-cache
        uses: actions/cache@v4
        with:
          path: data/sources
          key: data-sources-v1

      - name: Download external data sources
        if: steps.guard.outputs.skip == 'false'
        run: |
          mkdir -p data/sources/csu/sldb2021 \
                   data/sources/cz/places \
                   data/sources/osm

          dl() {
            local url="$1" dest="$2"
            if [ -f "$dest" ]; then
              echo "Cached: $dest ($(stat -c%s "$dest") bytes)"
              return 0
            fi
            echo "Downloading: $url -> $dest"
            curl -fsSL --retry 3 --retry-delay 5 -o "$dest.part" "$url" && mv "$dest.part" "$dest"
          }

          # CSD (V2_CSD2025.xlsx) is committed in the repo — no download needed.

          dl "https://csu.gov.cz/docs/107508/4dbdab3b-905c-deff-4cfa-e4828a6fa2de/dojizdka_obce.csv?version=1.0" \
             data/sources/csu/sldb2021/dojizdka_obce.csv

          dl "https://csu.gov.cz/docs/107508/79c509a0-261c-b4dd-d58d-c05955a24a2c/sldb2021_pohlavi.csv" \
             data/sources/csu/sldb2021/populace_pohlavi.csv

          dl "https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf" \
             data/sources/osm/czech-republic-latest.osm.pbf

          echo "--- data/sources contents ---"
          find data/sources -type f -exec ls -lh {} \;

      - name: Set up Docker Buildx
        if: steps.guard.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.guard.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        if: steps.guard.outputs.skip == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.city }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: steps.guard.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: CITY=${{ matrix.city }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.city }}
          cache-to: type=gha,mode=max,scope=${{ matrix.city }}

      - name: Extract pipeline reports from image
        if: steps.guard.outputs.skip == 'false'
        run: |
          IMG="${{ env.IMAGE_PREFIX }}-${{ matrix.city }}:latest"
          OUT="reports-${{ matrix.city }}"
          mkdir -p "$OUT"

          CID=$(docker create "$IMG")
          DEMAND="outputs/${{ matrix.city }}/baseline/demand"
          NETWORK="outputs/${{ matrix.city }}/baseline/network"
          EXPERIMENTS="outputs/experiments/${{ matrix.city }}"

          for f in calibration_report.json validation_report.json \
                   assignment_convergence.json od_summary.json \
                   distribution_report.json temporal_profile.json \
                   supply_audit.json matching_diagnostics.csv; do
            docker cp "$CID:/app/$DEMAND/$f" "$OUT/$f" 2>/dev/null || true
          done
          docker cp "$CID:/app/$NETWORK/network_summary.json" "$OUT/network_summary.json" 2>/dev/null || true

          mkdir -p "experiments-${{ matrix.city }}"
          docker cp "$CID:/app/$EXPERIMENTS/." "experiments-${{ matrix.city }}/" 2>/dev/null || true
          docker rm "$CID"

          echo "Extracted reports:"
          ls -lh "$OUT"/
          echo "Extracted experiments:"
          find "experiments-${{ matrix.city }}" -type f | head -50 || true

      - name: Upload pipeline reports
        if: steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.city }}
          path: reports-${{ matrix.city }}/
          retention-days: 90

      - name: Upload experiment results
        if: steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: experiments-${{ matrix.city }}
          path: experiments-${{ matrix.city }}/
          retention-days: 90

      - name: Pipeline summary
        if: steps.guard.outputs.skip == 'false'
        run: |
          OUT="reports-${{ matrix.city }}"
          EXP="experiments-${{ matrix.city }}"
          CITY="${{ matrix.city }}"

          python3 - "$OUT" "$CITY" "$EXP" <<'PYEOF'
          import json, sys, os
          out_dir, city, exp_dir = sys.argv[1], sys.argv[2], sys.argv[3]

          def load(name, base=None):
              p = os.path.join(base or out_dir, name)
              if not os.path.exists(p):
                  return None
              with open(p) as f:
                  return json.load(f)

          def fmt(v, suffix="", prec=2):
              if v is None:
                  return "n/a"
              if isinstance(v, bool):
                  return "yes" if v else "no"
              if isinstance(v, float):
                  return f"{v:.{prec}f}{suffix}"
              return str(v)

          calib = load("calibration_report.json")
          valid = load("validation_report.json")
          assign = load("assignment_convergence.json")

          lines = [f"## {city.title()} — Pipeline Results\n"]

          if calib:
              final = calib.get("final") or {}
              lines.append("### Calibration")
              lines.append(f"| Metric | Value |")
              lines.append(f"|--------|-------|")
              lines.append(f"| Method | {calib.get('method', 'n/a')} |")
              lines.append(f"| Iterations | {calib.get('iterations', 'n/a')} |")
              lines.append(f"| Converged | {fmt(calib.get('converged'))} |")
              lines.append(f"| R² | {fmt(final.get('r2'))} |")
              lines.append(f"| Slope | {fmt(final.get('slope'))} |")
              lines.append(f"| %RMSE | {fmt(final.get('pct_rmse'), '%', 1)} |")
              lines.append(f"| Bias | {fmt(final.get('bias_pct'), '%', 1)} |")
              lines.append(f"| GEH mean | {fmt(final.get('geh_mean'))} |")
              lines.append(f"| GEH<5 % | {fmt(final.get('geh_lt5_pct'), '%', 1)} |")
              sl = final.get("max_screenline_pct_dev")
              lines.append(f"| Max screenline dev | {fmt(sl, '%', 1)} |")
              lines.append("")

          if valid:
              bm = valid.get("benchmarks") or {}
              qg = valid.get("quality_gates") or {}
              icon = ":white_check_mark:" if bm.get("overall_pass") else ":x:"
              lines.append(f"### Validation {icon}")
              lines.append(f"| Metric | Value | Pass |")
              lines.append(f"|--------|-------|------|")
              lines.append(f"| R² | {fmt(bm.get('daily_r2'))} | {fmt(bm.get('daily_r2_pass'))} |")
              lines.append(f"| Slope | {fmt(bm.get('daily_slope'))} | {fmt(bm.get('daily_slope_pass'))} |")
              lines.append(f"| %RMSE | {fmt(bm.get('daily_pct_rmse'), '%', 1)} | {fmt(bm.get('daily_pct_rmse_pass'))} |")
              lines.append(f"| Bias | {fmt(bm.get('daily_bias_abs_pct'), '%', 1)} | {fmt(bm.get('daily_bias_pass'))} |")
              lines.append(f"| Screenline max error | {fmt(bm.get('screenline_max_error_pct'), '%', 1)} | {fmt(bm.get('daily_screenline_pass'))} |")
              lines.append(f"| **Overall** | | **{fmt(bm.get('overall_pass'))}** |")
              if qg.get("hard_reject"):
                  lines.append(f"\n> :warning: **Hard reject** triggered")
              if qg.get("warnings"):
                  for w in qg["warnings"]:
                      lines.append(f"> :warning: {w}")
              lines.append("")

          if assign:
              lines.append("### Assignment")
              lines.append(f"| Metric | Value |")
              lines.append(f"|--------|-------|")
              lines.append(f"| Algorithm | {assign.get('algorithm', 'n/a')} |")
              lines.append(f"| Converged | {fmt(assign.get('converged'))} |")
              lines.append(f"| Final RGAP | {fmt(assign.get('final_rgap'))} |")
              lines.append(f"| Iterations | {assign.get('n_iterations', 'n/a')} |")
              lines.append("")

          exp_report = load("experiment_report.json", base=exp_dir)
          if exp_report:
              counts = exp_report.get("counts", {})
              elapsed = exp_report.get("total_elapsed_s", 0)
              lines.append("### Experiments")
              lines.append(f"| Experiment | Status | Time |")
              lines.append(f"|------------|--------|------|")
              for e in exp_report.get("experiments", []):
                  name = e["experiment"].replace("_", " ")
                  st = e["status"]
                  icon = {"ok": ":white_check_mark:", "skipped": ":fast_forward:", "error": ":x:"}.get(st, st)
                  t = f'{e.get("elapsed_s", 0):.1f}s'
                  reason = f' ({e["reason"][:60]})' if "reason" in e else ""
                  lines.append(f"| {name} | {icon} {st}{reason} | {t} |")
              lines.append(f"\n**Totals:** {counts.get('ok', 0)} ok, "
                           f"{counts.get('skipped', 0)} skipped, "
                           f"{counts.get('error', 0)} error ({elapsed:.0f}s)")
              lines.append("")

          summary = "\n".join(lines)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          print(summary)
          PYEOF
