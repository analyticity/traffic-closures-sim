project_path: "project/brno_aeq"

# Externí brány a supernetwork jen pro dálnice (motorway) a rychlostní silnice (trunk).
# Konkrétní koridory přes hranici AOI: viz poslední gateway_diagnostics.csv v outputs/brno/…
supernetwork:
  eligible_gateway_types:
    - motorway
    - motorway_link
    - trunk
    - trunk_link

osm:
  place_name: "Brno, Czechia"

network:
  normalization_config: "config/brno/network_normalization.yaml"

zoning:
  sources:
    - type: osm
      place: "Okres Brno-město, Czechia"
      admin_level: "9"
    - type: osm
      place: "Okres Brno-venkov, Czechia"
      admin_level: "9"
  external_gateways:
    enabled: true
    whitelist: ["D1", "D2", "I/43", "I/52", "I/50"]
    auto_discover:
      enabled: false

demand:
  segments:
    external_local:
      total_daily_trips: 130000
  sldb:
    external_processing:
      through_traffic_scale: 0.30

calibration:
  gateway_calibration:
    damping: 0.26
    min_factor: 0.55
    max_factor: 1.45
  odme:
    max_outer_iterations: 32
    entropy_step_size: 0.22
    convergence_tol: 0.0008
    assign_max_iter: 80
    # Tertiary: cap upward class correction (count posts say „málo“, síť už přebytky).
    # Trunk: floor — model podstřeluje oproti CSD na dálnicích/rychlostních.
    class_residual_ratio_caps:
      tertiary: 1.05
    class_residual_ratio_floors:
      trunk: 1.05
    stages:
      - name: "stabilize"
        max_iterations: 15
      - name: "refine"
        max_iterations: 25
  screenlines_path: "config/brno/screenlines.yaml"
  auto_screenlines:
    # Auto SL mimo poměr model/obs — nepočítat do SL max dev (špatný link / nulový tok).
    exclude_auto_ratio_below: 0.20
    exclude_auto_ratio_above: 5.0

datasets:
  enabled: true
  sources:
    commuting_sldb2021:
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Brno-město", "Brno-venkov"]
            - field: "op_orp"
              values: ["Brno"]
        destination:
          keep_all: true
    calibration_brno_pentlogram_2024:
      enabled: false
    validation_csd2025_v2:
      usage:
        area_filter: { enabled: true, region_hint: "Jihomoravský kraj" }

baseline_closures:
  enabled: false
  matching:
    max_distance_m: 50
    require_road_ref_match: true
