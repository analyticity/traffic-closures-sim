project_path: "project/brno_aeq"

# External gateways and supernetwork: motorways and trunk roads only.
# Corridor details at AOI boundary: see latest gateway_diagnostics.csv in outputs/brno/…
supernetwork:
  eligible_gateway_types:
    - motorway
    - motorway_link
    - trunk
    - trunk_link

osm:
  place_name: "Brno, Czechia"

network:
  normalization_config: "config/brno/network_normalization.yaml"

zoning:
  sources:
    - type: osm
      place: "Okres Brno-město, Czechia"
      admin_level: "9"
    - type: osm
      place: "Okres Brno-venkov, Czechia"
      admin_level: "9"
  external_gateways:
    enabled: true
    max_anchor_distance_m: 5000
    whitelist:
      - "D1"
      # Main D2 carriageway (~49.124°N); default snap lands on low-flow spur near boundary.
      - ref: "D2"
        anchor_latlon: [49.123847, 16.644072]
      - "I/43"
      # I/52 anchor at ~49.123°N between NB node 158734 and SB node 158735;
      # north of the trunk_link 1147 ramp at node 13769 that bypassed the screenline filter.
      - ref: "I/52"
        anchor_latlon: [49.122980, 16.604120]
    auto_discover:
      enabled: false

demand:
  segments:
    external_local:
      total_daily_trips: 130000
  sldb:
    external_processing:
      through_traffic_scale: 0.30

calibration:
  gateway_calibration:
    damping: 0.08
    min_factor: 0.85
    max_factor: 1.20
  auto_screenlines:
    gateway_count_target: "motor_total"
  odme:
    max_outer_iterations: 48
    entropy_step_size: 0.15
    convergence_tol: 0.0008
    stall_patience: 20
    global_residual_damping: 0.10
    assign_max_iter: 120
    assign_rgap_target: 0.004
    stages:
      - name: "stabilize"
        max_iterations: 20
      - name: "refine"
        max_iterations: 35
  screenlines_path: "config/brno/screenlines.yaml"
  matching:
    require_csd_road_ref_match: true
    csd_validation_exclude_sil: ["52", "602", "430", "380", "37445", "41614", "15272", "385", "373"]
    exclude_csd_roads: ["3846", "386", "15272", "602", "430", "380", "37445", "41614", "385", "373"]

datasets:
  enabled: true
  sources:
    commuting_sldb2021:
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Brno-město", "Brno-venkov"]
            - field: "op_orp"
              values: ["Brno"]
        destination:
          keep_all: true
    calibration_brno_pentlogram_2024:
      enabled: false
    validation_csd2025_v2:
      usage:
        area_filter: { enabled: true, region_hint: "Jihomoravský kraj" }

baseline_closures:
  enabled: false
  matching:
    max_distance_m: 50
    require_road_ref_match: true
