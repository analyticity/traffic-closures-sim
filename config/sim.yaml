# Projekt a CRS
project_path: "project/brno_aeq"
crs_epsg: 5514

# OSM zdroj sítě
osm:
  place_name: "Brno, Czechia"

# Síť
network:
  experiment_profile: "motorway_push"
  output_dir: "outputs/baseline/network"
  maps_dir: "outputs/baseline/maps"

# Zónování
zoning:
  sources:
    - place: "Okres Brno-město, Czechia"
      admin_level: "9"
    - place: "Okres Brno-venkov, Czechia"
      admin_level: "9"

  aoi:
    quantile: 0.003
    pad_ratio: 0.008
    extra_margin_m: 200
    shift_x_m: 0
    shift_y_m: 0

  zone_area_filter:
    enabled: true
    rel_factor: 10
    abs_max_km2: 250

  max_connectors: 6
  max_distance_m: 3000
  connector_speed_kmh: 20
  connector_capacity_vph: 2000
  connector_lanes: 1
  connector_access_penalty_s: 300

  cache_file: "data/zones/zones.gpkg"
  output_dir: "outputs/baseline/zones"
  map_dpi: 250

  external_gateways:
    enabled: true
    whitelist: ["D1", "D2", "I/43", "I/50", "I/52", "I/23"]
    boundary_buffer_m: 600
    min_gateway_separation_m: 1800
    zone_size_m: 40
    zone_offset_m: 10
    connectors_per_gateway: 2
    candidate_outer_quantile: 0.95
    allowed_link_types:
      - motorway
      - motorway_link
      - trunk
      - trunk_link
      - primary
      - primary_link

# OD matice
demand:
  output_dir: "outputs/baseline/demand"
  matrix_path: "data/demand/od_matrix.aem"
  matrix_name: "demand"

  # důležité: povolit fallback externích commuting toků na gateway zóny
  use_gateway_fallback_in_commuting: true

  sldb:
    include_lokalizace:
      - "0_na_adrese_OP"
      - "1_meziobecni"
    # důležité: nepoužívat jen interní páry, jinak se externí commuting ztrácí
    only_internal_pairs: false

  conversion:
    work:
      car_share: 0.60
      occupancy: 1.25
      trips_per_person: 2.0
    school:
      car_share: 0.25
      occupancy: 1.30
      trips_per_person: 2.0

  segments:
    other:
      source: "gravity"
      trip_rate: 1.5
      car_share: 0.45
      occupancy: 1.40
      beta: 0.0001

    external_local:
      source: "gateway_local"
      total_daily_trips: 50000
      corridor_weights: {}

    external_through:
      source: "gateway_pairs"
      total_daily_trips: 100000
      default_pair_weight: 1.0
      pairs: []

  time_slices:
    periods: ["am", "ip", "pm", "ev"]

    weekday:
      work:
        outbound:
          am: 0.80
          ip: 0.20
        return:
          pm: 0.80
          ev: 0.20
      school:
        outbound:
          am: 0.90
          ip: 0.10
        return:
          pm: 0.70
          ev: 0.30

    segments:
      other:
        am: 0.25
        ip: 0.30
        pm: 0.30
        ev: 0.15
      external_local:
        am: 0.28
        ip: 0.22
        pm: 0.30
        ev: 0.20
      external_through:
        am: 0.24
        ip: 0.28
        pm: 0.30
        ev: 0.18

  distribution:
    enabled: false
    deterrence_function: "EXPO"
    pa_trip_rate: 2.5
    pa_car_share: 0.50
    pa_occupancy: 1.30
    ipf_max_iter: 200
    ipf_tolerance: 0.001

    # dočasně menší váha IPF/blendu, dokud distribuce ještě neběží nad síťovými skimy
    blend_alpha: 0.35

# Kalibrace a validace
calibration:
  algorithm: "bfw"
  max_iter: 100
  rgap_target: 0.001
  core_name: "wd_daily"

  gateway_calibration:
    enabled: true
    observed_path: "data/cache/gateway_counts_2025.parquet"
    damping: 0.15
    min_factor: 0.85
    max_factor: 1.15

  match_buffer_m: 25.0

  # důležité: zapnout direction-aware match
  match_direction_aware: true
  match_conflict_resolution: "nearest"
  count_target: "car_only"

  # důležité: pro dělené komunikace agregovat koridor
  aggregate_corridor: false
  save_skims: true

  max_iterations: 15
  convergence:
    geh_lt5_target_pct: 85.0

    # malé dočasné zhoršení GEH nesmí zastavit kalibraci hned po 2. iteraci
    # funguje jako "povolená tolerance" pro přechodné výkyvy
    min_improvement_pct: -2.0

  scaling:
    method: "global"
    damping: 0.15
    min_factor: 0.85
    max_factor: 1.15

  screenlines_path: "config/screenlines.yaml"

# Datové sady
datasets:
  enabled: true
  root_dir: "data/sources"
  cache_dir: "data/cache"

  http:
    timeout_s: 60
    retries: 3
    user_agent: "simulation-pipeline/1.0"

  sources:
    commuting_sldb2021:
      enabled: true
      provider: "csu_open_data_csv"
      url: "https://csu.gov.cz/docs/107508/4dbdab3b-905c-deff-4cfa-e4828a6fa2de/dojizdka_obce.csv?version=1.0"
      out_path: "data/sources/csu/sldb2021/dojizdka_obce.csv"
      format:
        type: "csv"
        delimiter: ","
        encoding: "utf-8"
      purposes: ["work", "school"]
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Brno-město", "Brno-venkov"]
            - field: "op_orp"
              values: ["Brno"]
        destination:
          keep_all: true

    calibration_brno_pentlogram_2024:
      enabled: true
      provider: "arcgis_feature_service"
      service_url: "https://services6.arcgis.com/fUWVlHWZNxUvTUh8/arcgis/rest/services/intenzita_dopravy_pentlogram_2024/FeatureServer"
      layer_id: 0
      out_path: "data/sources/brno/intensity/intenzita_dopravy_pentlogram_2024.geojson"
      output:
        format: "geojson"
        out_epsg: 5514
      units:
        car_24_multiplier: 1000
        truc_24_multiplier: 1000
      query:
        where: "1=1"
        out_fields: ["*"]
        geometry_clip:
          enabled: true
          use_aoi: true
      usage:
        calibration_target: "link_counts"

    # legacy název ponechaný kvůli loaderu;
    # POZOR: tady máš aktuálně URL na CSD 2025, ne 2020
    validation_csd2020_v2:
      enabled: true
      year: 2025
      provider: "http_file"
      url: "https://www.rsd.cz/documents/38144/3734982/V2_CSD_2025.xlsx/50663492-395b-0fd4-f365-d18440997ca5?t=1773922634346"
      out_path: "data/sources/rsd/csd2025/V2_CSD2025.xlsx"
      format:
        type: "xlsx"
      usage:
        validation_target: "aadt_screenlines"
        area_filter:
          enabled: true
          region_hint: "Jihomoravský kraj"

    population_sldb2021:
      enabled: true
      provider: "http_file"
      url: "https://csu.gov.cz/docs/107508/79c509a0-261c-b4dd-d58d-c05955a24a2c/sldb2021_pohlavi.csv"
      out_path: "data/sources/csu/sldb2021/populace_pohlavi.csv"
      format:
        type: "csv"
        delimiter: ","
        encoding: "utf-8"
      usage:
        socioeconomic: "population_per_zone"

# REST API
api:
  host: "0.0.0.0"
  port: 8000
