[project]
name = "simulation"
version = "0.1.0"
description = "Traffic closures simulation pipeline (AequilibraE)"
requires-python = ">=3.10"

dependencies = [
  "pyyaml>=6.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyarrow>=14.0",
  "pyproj>=3.6",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "networkx>=3.0",
  "requests>=2.31",
  "openpyxl>=3.1",
  "aequilibrae>=1.1.4",
  "fastapi>=0.100",
  "pydantic>=2.0",
  "uvicorn>=0.20",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
geo = [
  "osmnx>=1.9",
]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: full pipeline tests requiring network access and heavy dependencies",
]

[tool.ruff]
line-length = 100
