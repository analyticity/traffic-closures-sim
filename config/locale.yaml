# Locale-specific configuration for Czech Republic / Brno.
# Replace this file when deploying for a different city or country.

# Public holidays — recurring (month, day) pairs.
# Used by temporal.py to classify workdays vs holidays.
holidays_md:
  - [1, 1]
  - [5, 1]
  - [5, 8]
  - [7, 5]
  - [7, 6]
  - [9, 28]
  - [10, 28]
  - [11, 17]
  - [12, 24]
  - [12, 25]
  - [12, 26]

# CSD (nationwide traffic census) region filter.
# NUTS code fragment to select relevant census sections.
csd_region_filter:
  column: kk
  contains: "064"

# Municipal-part to cadastral-unit mapping (for SLDB population preprocessing).
# Used by fetch_datasets.py → preprocess_population_sldb2021.
municipal_parts_to_cadastral:
  "Brno-střed": ["Město Brno", "Staré Brno", "Veveří", "Pisárky", "Stránice", "Zábrdovice", "Trnitá", "Štýřice"]
  "Brno-Žabovřesky": ["Žabovřesky"]
  "Brno-Královo Pole": ["Královo Pole", "Ponava", "Sadová"]
  "Brno-sever": ["Husovice", "Černá Pole", "Lesná", "Soběšice"]
  "Brno-Židenice": ["Židenice"]
  "Brno-Černovice": ["Černovice"]
  "Brno-jih": ["Komárov", "Horní Heršpice", "Dolní Heršpice", "Přízřenice"]
  "Brno-Bohunice": ["Bohunice"]
  "Brno-Starý Lískovec": ["Starý Lískovec"]
  "Brno-Nový Lískovec": ["Nový Lískovec"]
  "Brno-Kohoutovice": ["Kohoutovice"]
  "Brno-Jundrov": ["Jundrov"]
  "Brno-Bystrc": ["Bystrc"]
  "Brno-Kníničky": ["Kníničky"]
  "Brno-Komín": ["Komín"]
  "Brno-Medlánky": ["Medlánky"]
  "Brno-Řečkovice a Mokrá Hora": ["Řečkovice", "Mokrá Hora"]
  "Brno-Maloměřice a Obřany": ["Maloměřice", "Obřany"]
  "Brno-Líšeň": ["Líšeň"]
  "Brno-Slatina": ["Slatina"]
  "Brno-Tuřany": ["Tuřany", "Brněnské Ivanovice", "Holásky", "Dvorska"]
  "Brno-Chrlice": ["Chrlice"]
  "Brno-Bosonohy": ["Bosonohy"]
  "Brno-Ivanovice": ["Ivanovice"]
  "Brno-Žebětín": ["Žebětín"]
  "Brno-Jehnice": ["Jehnice"]
  "Brno-Útěchov": ["Útěchov u Brna"]
  "Brno-Ořešín": ["Ořešín"]

# Road classification from CSD road number (e.g. "D1" → motorway, "43" → trunk).
# Used by calibration.py and temporal.py.
road_classification:
  motorway_prefix: "D"
  trunk_max: 99
  secondary_max: 999

# Czech reference speeds by road class (km/h) used for speed validation.
# From calibration.py _CZECH_REFERENCE_SPEEDS.
reference_speeds:
  motorway: 130
  trunk: 90
  primary: 70
  secondary: 60
  tertiary: 50
  residential: 30
  motorway_link: 80
  trunk_link: 70
  primary_link: 50
  secondary_link: 40
  tertiary_link: 30
