project_path: "project/brno_aeq"

# External gateways and supernetwork: motorways and trunk roads only.
# Corridor details at AOI boundary: see latest gateway_diagnostics.csv in outputs/brno/…
supernetwork:
  # Filtruje LEN auto-objavené brány (whitelist ich obchádza, viď
  # supernetwork/pipeline.py: mask = type_ok | is_whitelist).
  # secondary je tu preto, aby sa správanie nezmenilo, keby sa auto_discover zaplo.
  eligible_gateway_types:
    - motorway
    - motorway_link
    - trunk
    - trunk_link
    - secondary
    - secondary_link

osm:
  place_name: "Brno, Czechia"

network:
  normalization_config: "config/brno/network_normalization.yaml"

zoning:
  # Zóny sa sťahujú z Overpassu; s cache sa to spraví raz a ďalšie behy
  # build-zones sú offline a reprodukovateľné. Zmazať pri zmene `sources`.
  cache_file: "data/brno/cache/zones_osm.gpkg"
  sources:
    - type: osm
      place: "Okres Brno-město, Czechia"
      admin_level: "9"
    - type: osm
      place: "Okres Brno-venkov, Czechia"
      admin_level: "9"
  external_gateways:
    enabled: true
    max_anchor_distance_m: 5000
    # II. trieda je v OSM `secondary` — bez rozšírenia tohto zoznamu by
    # select_gateway_target_nodes na nej nenašiel žiadne uzly (default je len
    # motorway/trunk/primary).
    allowed_link_types:
      - motorway
      - motorway_link
      - trunk
      - trunk_link
      - primary
      - primary_link
      - secondary
      - secondary_link
    whitelist:
      - "D1"
      # Main D2 carriageway (~49.124°N); default snap lands on low-flow spur near boundary.
      - ref: "D2"
        anchor_latlon: [49.123847, 16.644072]
      # I/43 sa pri Českej (~49.2865°N) v OSM reálne zužuje z `trunk` 2+2 na
      # `primary` 1+1 (kapacita 3600 -> 1400/pruh). Bez kotvy brána sadne na ten
      # úzky úsek (uzly 15858/15859, 818 a 5 752 voz/deň) a celý externý dopyt
      # sa cez neho nepretlačí — modelovaných 15 118 voz/deň proti 40 582 z CSD.
      # Kotva na 2+2 úseku južne od zúženia.
      - ref: "I/43"
        anchor_latlon: [49.282600, 16.567400]
      # I/52 anchor at ~49.123°N between NB node 158734 and SB node 158735;
      # north of the trunk_link 1147 ramp at node 13769 that bypassed the screenline filter.
      - ref: "I/52"
        anchor_latlon: [49.122980, 16.604120]
      # --- P0-1: radiály, ktoré prekračujú hranicu Brna a doteraz nemali bránu.
      # AADT na hranici okresu Brno-město / Brno-venkov podľa CSD 2025 (v2).
      # POZOR na formát: road_ref_token_variants() rozširuje na holé číslo iba
      # prefixy I/ a D/ (I/50 -> {I50, 50, D50}). Cesty II. a III. triedy sa
      # preto píšu holým číslom tak, ako ich má OSM v tagu `ref`.
      - "I/50"      # východ (Slatina → Šlapanice), 24 271 voz/deň
      - "602"       # II/602, západ (Bosonohy → Troubsko), 18 523
      - "380"       # II/380, juhovýchod (Tuřany → Sokolnice), 12 348
      - "430"       # II/430, východ (Slatina → Šlapanice), 10 115
      # Ďalšie kandidátky (III. trieda, vyžadujú aj `tertiary` v allowed_link_types):
      #   6401  sever, 10 998   |   15286  Šlapanice, 9 977
    auto_discover:
      enabled: false

demand:
  segments:
    external_local:
      # Odvodené z kamdojizdime.cz (MV ČR), stĺpec pocet_osob_pd (Po–Pá 6–18 h),
      # priemer 4 sezón 2021–2023, typy T2 + T3 + N pri MINIMÁLNEJ frekvencii
      # pobytov podľa metodiky INTENS (T2 >=4, T3 >=2, N >=1 pobyt / 28 dní).
      # Konverzia osoby -> vozidlá: car_share 0.48, occupancy 1.20, 2 cesty/deň.
      # Je to DOLNÁ HRANICA, nie bodový odhad — skutočná frekvencia je vyššia.
      # Predchádzajúca hodnota 130000 bola odhad bez opory v dátach.
      total_daily_trips: 35334
  sldb:
    external_processing:
      through_traffic_scale: 0.30

calibration:
  gateway_calibration:
    damping: 0.08
    min_factor: 0.85
    max_factor: 1.20
  auto_screenlines:
    gateway_count_target: "motor_total"
  odme:
    max_outer_iterations: 48
    entropy_step_size: 0.15
    convergence_tol: 0.0008
    stall_patience: 20
    global_residual_damping: 0.10
    assign_max_iter: 120
    assign_rgap_target: 0.004
    stages:
      - name: "stabilize"
        max_iterations: 20
      - name: "refine"
        max_iterations: 35
  screenlines_path: "config/brno/screenlines.yaml"
  matching:
    require_csd_road_ref_match: true
    # P0-2: ručné vylúčenia zrušené. 7 z 12 pôvodne vylúčených ciest
    # (602, 430, 380, 373, 3846, 41614, 15278) sú hraničné radiály, ktoré do
    # tejto zmeny nemali bránu — model na nich nemohol mať pravdu. Vylúčenie
    # teda maskovalo dôsledok návrhu brán, nie chybu párovania geometrie.
    # Pôvodné hodnoty (pre prípad návratu):
    #   csd_validation_exclude_sil: ["52","602","430","380","37445","41614","15272","385","373"]
    #   exclude_csd_roads: ["3846","386","15272","602","430","380","37445","41614","385","373","15278","15283"]
    csd_validation_exclude_sil: []
    exclude_csd_roads: []

datasets:
  enabled: true
  sources:
    commuting_sldb2021:
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Brno-město", "Brno-venkov"]
            - field: "op_orp"
              values: ["Brno"]
        destination:
          keep_all: true
    calibration_brno_pentlogram_2024:
      enabled: false
    validation_csd2025_v2:
      usage:
        area_filter: { enabled: true, region_hint: "Jihomoravský kraj" }

baseline_closures:
  enabled: false
  matching:
    max_distance_m: 50
    require_road_ref_match: true
