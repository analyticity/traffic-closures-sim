[project]
name = "simulation"
version = "0.1.0"
description = "Traffic closures simulation pipeline (AequilibraE)"
requires-python = ">=3.10"

dependencies = [
  "pyyaml>=6.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyarrow>=14.0",
  "matplotlib>=3.8",
  "networkx>=3.0",
  "requests>=2.31",
  "openpyxl>=3.1",
  "aequilibrae>=1.1.4",
  "fastapi>=0.100",
  "uvicorn>=0.20"
]

[tool.ruff]
line-length = 100
