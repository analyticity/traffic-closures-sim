# Projekt a CRS
project_path: "project/brno_aeq"
crs_epsg: 5514

# OSM zdroj sítě
osm:
  place_name: "Brno, Czechia"

# Síť
network:
  # Defaults and named profiles for normalize-network (speed/lanes/capacity gaps, experiment tweaks).
  normalization_config: "config/network_normalization.yaml"
  # baseline = no extra caps/penalties; named profiles adjust hierarchy / local penalties (see YAML above).
  experiment_profile: "baseline"
  output_dir: "outputs/baseline/network"
  maps_dir: "outputs/baseline/maps"
  # After trim: drop OSM non-road ways and links without car mode ``c`` (footway, path, cycleway, …).
  drivable_network:
    enabled: true
    require_mode_car: true
    # excluded_link_types: []  # optional override; if omitted, built-in OSM walk/cycle list is used

# Zónování
zoning:
  sources:
    - place: "Okres Brno-město, Czechia"
      admin_level: "9"
    - place: "Okres Brno-venkov, Czechia"
      admin_level: "9"

  aoi:
    quantile: 0.003
    pad_ratio: 0.008
    extra_margin_m: 200
    shift_x_m: 0
    shift_y_m: 0

  zone_area_filter:
    enabled: true
    rel_factor: 10
    abs_max_km2: 250

  max_connectors: 6
  max_distance_m: 3000
  connector_speed_kmh: 20
  connector_capacity_vph: 2000
  connector_lanes: 1
  connector_access_penalty_s: 300

  cache_file: "data/zones/zones.gpkg"
  output_dir: "outputs/baseline/zones"
  map_dpi: 250

  external_gateways:
    enabled: true
    whitelist: ["D1", "D2", "I/43", "I/50", "I/52", "I/23"]

    boundary_buffer_m: 600
    min_gateway_separation_m: 1800
    zone_size_m: 40
    zone_offset_m: 10
    connectors_per_gateway: 2
    candidate_outer_quantile: 0.95

    allowed_link_types:
      - motorway
      - motorway_link
      - trunk
      - trunk_link
      - primary
      - primary_link

    export_lookup: true
    export_lookup_path: "data/cache/gateway_lookup_seed.parquet"
    merge_boundary_near_candidates: false

# Coarse national supernetwork
supernetwork:
  output_dir: "outputs/baseline/supernetwork"
  cache_dir: "data/cache/supernetwork"
  pbf_path: "data/sources/osm/czech-republic-latest.osm.pbf"
  place_centroids_path: "data/cache/cz_place_centroids.parquet"
  place_centroids_crs_epsg: 4326

  contract_graph: true
  contract_exclude_degree_leq: 2

  national_network:
    highway_types:
      - motorway
      - motorway_link
      - trunk
      - trunk_link
      - primary
      - primary_link
      - secondary
      - secondary_link

  relation_filter:
    detour_ratio_max: 1.25
    max_extra_minutes: 20.0
    allow_same_gateway_pair: false

# OD matice
demand:
  output_dir: "outputs/baseline/demand"
  matrix_path: "data/demand/od_matrix.aem"
  matrix_name: "demand"

  # kvůli kompatibilitě může zatím zůstat true
  use_gateway_fallback_in_commuting: false

  sldb:
    include_lokalizace:
      - "0_na_adrese_OP"
      - "1_meziobecni"
    only_internal_pairs: false

    filtered_parquet: "data/cache/dojizdka_obce.parquet"
    full_cr_parquet: "data/cache/dojizdka_obce_full_cr.parquet"

    external_processing:
      enabled: true
      use_full_cr_dataset: true
      external_gateway_lookup_path: "data/cache/external_gateway_lookup.parquet"
      through_gateway_pairs_path: "data/cache/through_gateway_pairs.parquet"
      use_external_internal: true
      use_internal_external: true
      use_external_external_via_brno: true
      drop_external_external_outside_model: true

  conversion:
    work:
      car_share: 0.60
      occupancy: 1.25
      trips_per_person: 2.0
    school:
      car_share: 0.25
      occupancy: 1.30
      trips_per_person: 2.0

  segments:
    other:
      source: "gravity"
      trip_rate: 0.6
      car_share: 0.35
      occupancy: 1.50
      beta: 0.00015
      defaults:
        trip_rate: 0.6
        car_share: 0.35
        occupancy: 1.50
        beta: 0.00015

    external_local:
      enabled: false
      source: "gateway_local"
      total_daily_trips: 30000
      corridor_weights: {}
      mode: "residual_synthetic"

    external_through:
      enabled: false
      source: "gateway_pairs"
      total_daily_trips: 30000
      default_pair_weight: 1.0
      pairs: []
      mode: "residual_synthetic"
      data_driven_pairs_path: "data/cache/through_gateway_pairs.parquet"

  time_slices:
    periods: ["am", "ip", "pm", "ev"]

    weekday:
      work:
        outbound:
          am: 0.80
          ip: 0.20
        return:
          pm: 0.80
          ev: 0.20
      school:
        outbound:
          am: 0.90
          ip: 0.10
        return:
          pm: 0.70
          ev: 0.30

    segments:
      other:
        am: 0.25
        ip: 0.30
        pm: 0.30
        ev: 0.15
      external_local:
        am: 0.28
        ip: 0.22
        pm: 0.30
        ev: 0.20
      external_through:
        am: 0.24
        ip: 0.28
        pm: 0.30
        ev: 0.18

  temporal_policy:
    weekend_split:
      saturday_multiplier: 1.10
      sunday_multiplier: 0.90
      holiday_multiplier_to_sunday: 0.85
    fallback_day_period_shares:
      day: 0.785
      evening: 0.137
      night: 0.078
    demand_period_split_from_day:
      am: 0.35
      ip: 0.40
      pm: 0.25

  distribution:
    enabled: false
    deterrence_function: "EXPO"
    pa_trip_rate: 2.5
    pa_car_share: 0.50
    pa_occupancy: 1.30
    ipf_max_iter: 200
    ipf_tolerance: 0.001
    blend_alpha: 0.35

# Kalibrace a validace
calibration:
  algorithm: "bfw"
  max_iter: 150
  rgap_target: 0.002
  core_name: "wd_daily"

  gateway_calibration:
    enabled: true
    observed_path: "data/cache/gateway_counts_2025.parquet"
    damping: 0.08
    min_factor: 0.90
    max_factor: 1.10

  match_buffer_m: 15.0
  match_direction_aware: true
  match_conflict_resolution: "nearest"
  count_target: "car_only"
  aggregate_corridor: false
  save_skims: true

  max_iterations: 15
  # Restore data/demand/od_matrix.aem from .aem.orig at each calibrate (needed for fair tuning runs).
  reset_matrix_before_run: true
  convergence:
    geh_lt5_target_pct: 85.0
    min_improvement_pct: -2.0

  scaling:
    enabled: true
    method: "global"
    adaptive_data_driven: true
    damping: 0.08
    min_factor: 0.90
    max_factor: 1.10
    adaptive_policy:
      min_valid_pairs: 20
      ratio_quantiles:
        low: 0.10
        mid: 0.50
        high: 0.90
      clip_bounds:
        min_factor_low: 0.60
        min_factor_high: 0.98
        max_factor_low: 1.02
        max_factor_high: 1.80
      damping_formula:
        base: 0.08
        gain: 0.20
        min: 0.05
        max: 0.35
      blend_with_defaults: 0.50

  # Quality acceptance policy for calibration outputs.
  quality_gates:
    hard_class_bias_max_abs_pct: 90.0
    warn_wmape_pct: 47.0
    warn_geh_lt5_pct: 7.0
    objective_patience: 3
    # Keep weights in config to avoid hardcoded tuning constants.
    objective_weights:
      spearman: 120.0
      geh_lt5: 1.8
      wmape_pct: 1.0
      class_bias_max_abs_pct: 0.35
      pct_rmse: 0.35

  screenlines_path: "config/screenlines.yaml"

# Experiment policy (dehack): scripts should read thresholds/ranges from here.
experiments:
  policy:
    objective:
      primary: "ObjB"
      secondary: "ObjC"
      legacy: "ObjA"
      objB_weights:
        spearman: 120.0
        geh_lt5: 1.8
        wmape_pct: 1.0
        class_bias_max_abs_pct: 0.35
        pct_rmse: 0.35
      objC_weights:
        spearman: 150.0
        mean_mae_class: 0.12
        abs_log_sum_ratio: 25.0
        pct_rmse: 0.25
      sum_ratio_clip:
        min: 0.25
        max: 4.0
    guardrails:
      hard_class_bias_max_abs_pct: 90.0
      warn_wmape_pct: 47.0
      warn_geh_lt5_pct: 7.0
    tuning_ranges:
      assignment:
        max_iter: [100, 150, 200]
        rgap_target: [0.001, 0.002]
      matching:
        match_buffer_m: [10.0, 25.0, 45.0]
      scaling:
        damping: [0.05, 0.08, 0.15]
        min_factor: [0.75, 0.9]
        max_factor: [1.1, 1.25]
      gateway:
        damping: [0.08, 0.15]
      external_daily_trips: [10000, 20000, 30000]

# Datové sady
# Datové sady
datasets:
  enabled: true
  root_dir: "data/sources"
  cache_dir: "data/cache"

  http:
    timeout_s: 60
    retries: 3
    user_agent: "simulation-pipeline/1.0"

  sources:
    commuting_sldb2021:
      enabled: true
      provider: "csu_open_data_csv"
      url: "https://csu.gov.cz/docs/107508/4dbdab3b-905c-deff-4cfa-e4828a6fa2de/dojizdka_obce.csv?version=1.0"
      out_path: "data/sources/csu/sldb2021/dojizdka_obce.csv"
      filtered_out_parquet: "data/cache/dojizdka_obce.parquet"
      full_cr_out_parquet: "data/cache/dojizdka_obce_full_cr.parquet"
      format:
        type: "csv"
        delimiter: ","
        encoding: "utf-8"
      purposes: ["work", "school"]
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Brno-město", "Brno-venkov"]
            - field: "op_orp"
              values: ["Brno"]
        destination:
          keep_all: true
      preprocess:
        write_filtered: true
        write_full_cr: true

    calibration_brno_pentlogram_2024:
      enabled: true
      provider: "arcgis_feature_service"
      service_url: "https://services6.arcgis.com/fUWVlHWZNxUvTUh8/arcgis/rest/services/intenzita_dopravy_pentlogram_2024/FeatureServer"
      layer_id: 0
      out_path: "data/sources/brno/intensity/intenzita_dopravy_pentlogram_2024.geojson"
      output:
        format: "geojson"
        out_epsg: 5514
      units:
        car_24_multiplier: 1000
        truc_24_multiplier: 1000
      query:
        where: "1=1"
        out_fields: ["*"]
        geometry_clip:
          enabled: true
          use_aoi: true
      usage:
        calibration_target: "link_counts"

    validation_csd2025_v2:
      enabled: true
      year: 2025
      provider: "http_file"
      url: "https://www.rsd.cz/documents/38144/3734982/V2_CSD_2025.xlsx/50663492-395b-0fd4-f365-d18440997ca5?t=1773922634346"
      out_path: "data/sources/rsd/csd2025/V2_CSD2025.xlsx"
      format:
        type: "xlsx"
      usage:
        validation_target: "aadt_screenlines"
        area_filter:
          enabled: true
          region_hint: "Jihomoravský kraj"

    population_sldb2021:
      enabled: true
      provider: "http_file"
      url: "https://csu.gov.cz/docs/107508/79c509a0-261c-b4dd-d58d-c05955a24a2c/sldb2021_pohlavi.csv"
      out_path: "data/sources/csu/sldb2021/populace_pohlavi.csv"
      format:
        type: "csv"
        delimiter: ","
        encoding: "utf-8"
      usage:
        socioeconomic: "population_per_zone"

    # Oficiální countrywide RÚIAN address points (ZIP/CSV přes ATOM).
    # Z toho fetch_datasets vytvoří reprezentativní body obcí do cz_place_centroids.parquet.
    cz_place_centroids:
      enabled: true
      provider: "atom_file"
      url: "https://atom.cuzk.gov.cz/get.ashx?theme=RUIAN-CSV-ADR-ST"
      feed_cache_path: "data/sources/cz/places/ruian_csv_adr_st.atom.xml"
      out_path: "data/sources/cz/places/ruian_csv_adr_st.zip"
      out_parquet: "data/cache/cz_place_centroids.parquet"
      format:
        type: "zip_csv"
        asset_pattern: "(?i)(^|/)[0-9]{8}_OB_ADR_csv\\.zip$"
        member_pattern: "(?i)\\.csv$"
        delimiter: ";"
        encoding: "cp1250"
        source_crs_epsg: 2065
        output_crs_epsg: 4326
      columns:
        place_code: "Kód obce"
        place_name: "Název obce"
        x: "Souřadnice X"
        y: "Souřadnice Y"
      usage:
        supernetwork_places: "grouped_point_centroids"

    cz_roads_major_pbf:
      enabled: true
      provider: "http_file"
      url: "https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf"
      out_path: "data/sources/osm/czech-republic-latest.osm.pbf"
      format:
        type: "pbf"

# REST API
api:
  host: "0.0.0.0"
  port: 8000
