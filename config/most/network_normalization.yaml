# Network normalization for Most.
# Speed/lanes/capacity defaults for Czech link types are built into the code
# (see _DEFAULT_*_BY_LINK_TYPE in network_normalization.py).
# This file contains experiment profiles with city-specific overrides.

experiment_profiles:
  baseline:
    speed_floors:
      trunk: 50.0
      primary: 40.0
    capacity_factors:
      trunk: 0.80
      primary: 0.85
      secondary: 1.10
      tertiary: 0.85
    time_penalties:
      trunk: 5.0
      trunk_link: 6.0
      primary: 5.0
      primary_link: 6.0
      secondary: 4.0
      secondary_link: 4.0
      tertiary: 6.0
      tertiary_link: 6.0
      residential: 4.0
