project_path: "project/brno_aeq"

# External gateways and supernetwork: motorways and trunk roads only.
# Corridor details at AOI boundary: see latest gateway_diagnostics.csv in outputs/brno/…
supernetwork:
  eligible_gateway_types:
    - motorway
    - motorway_link
    - trunk
    - trunk_link

osm:
  place_name: "Brno, Czechia"

network:
  normalization_config: "config/brno/network_normalization.yaml"

zoning:
  sources:
    - type: osm
      place: "Okres Brno-město, Czechia"
      admin_level: "9"
    - type: osm
      place: "Okres Brno-venkov, Czechia"
      admin_level: "9"
  external_gateways:
    enabled: true
    whitelist: ["D1", "D2", "I/43", "I/52"]
    auto_discover:
      enabled: false

demand:
  segments:
    external_local:
      total_daily_trips: 130000
  sldb:
    external_processing:
      through_traffic_scale: 0.30

calibration:
  gateway_calibration:
    damping: 0.18
    min_factor: 0.70
    max_factor: 1.30
  auto_screenlines:
    gateway_count_target: "motor_total"
  odme:
    max_outer_iterations: 32
    entropy_step_size: 0.18
    convergence_tol: 0.0008
    assign_max_iter: 80
    class_residual_ratio_caps:
      tertiary: 1.05
    stages:
      - name: "stabilize"
        max_iterations: 15
      - name: "refine"
        max_iterations: 25
  screenlines_path: "config/brno/screenlines.yaml"
  matching:
    require_csd_road_ref_match: true
    csd_validation_exclude_sil: ["23"]

datasets:
  enabled: true
  sources:
    commuting_sldb2021:
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Brno-město", "Brno-venkov"]
            - field: "op_orp"
              values: ["Brno"]
        destination:
          keep_all: true
    calibration_brno_pentlogram_2024:
      enabled: false
    validation_csd2025_v2:
      usage:
        area_filter: { enabled: true, region_hint: "Jihomoravský kraj" }

baseline_closures:
  enabled: false
  matching:
    max_distance_m: 50
    require_road_ref_match: true
