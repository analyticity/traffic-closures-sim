project_path: "project/brno_aeq"

osm:
  place_name: "Brno, Czechia"
  buffer_km: 2

network:
  normalization_config: "config/brno/network_normalization.yaml"

zoning:
  sources:
    - type: osm
      place: "Okres Brno-město, Czechia"
      admin_level: "9"
    - type: osm
      place: "Okres Brno-venkov, Czechia"
      admin_level: "9"
  external_gateways:
    enabled: true

demand:
  segments:
    external_local:
      total_daily_trips: "auto"

calibration:
  rgap_target: 0.005
  count_source: "csd_split"
  screenlines_path: "config/brno/screenlines.yaml"
  auto_screenlines:
    enabled: true
    gateway_screenlines: true
    csd_screenlines: true
    csd_min_aadt: 5000

datasets:
  enabled: true
  sources:
    commuting_sldb2021:
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Brno-město", "Brno-venkov"]
            - field: "op_orp"
              values: ["Brno"]
        destination:
          keep_all: true
    # Optional Brno pentlogram (not used when calibration.count_source is csd_split).
    calibration_brno_pentlogram_2024:
      enabled: false
    validation_csd2025_v2:
      usage:
        area_filter: { enabled: true, region_hint: "Jihomoravský kraj" }

baseline_closures:
  enabled: true
