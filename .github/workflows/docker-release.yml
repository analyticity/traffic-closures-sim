name: Docker Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      city:
        description: "City to build (leave empty for all)"
        required: false
        type: choice
        options:
          - all
          - brno
          - olomouc
          - most
        default: all

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/simulation

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        city: [brno, olomouc, most]

    # Skip cities not selected in manual dispatch
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.city == 'all' ||
      github.event.inputs.city == matrix.city

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.city }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: CITY=${{ matrix.city }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.city }}
          cache-to: type=gha,mode=max,scope=${{ matrix.city }}
