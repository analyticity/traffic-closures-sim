# Screenline definitions for Most.
#
# Manual entries take precedence over auto-generated ones with the same name.
#
# Prefer geometry_wkt (WGS84 cut-line) + filter over raw link_id — link_id changes
# on OSM reimport; cut + osm_ref_norm/link_type keep the same cross-section.

screenlines:
  - name: "auto_gw_15_SE"
    description: "Gateway 15 SE — D15 primary; WGS84 cut + ref 15 (instead of link_id, stable across reimport)"
    type: "radial"
    geometry_wkt: "LINESTRING (13.705029572832533 50.492395945735396, 13.70500939777942 50.49215679522372)"
    filter:
      link_type: primary
      osm_ref_norm: "15"
    expected_links: 1
    observed_aadt_all: 9761.0

  # CSD count post — road II/2538 (tertiary), observed 1,132 veh/day.
  # Cut perpendicular to road axis at mid-segment; filter binds ref 2538 and type.
  - name: "manual_csd_ii2538_tertiary"
    description: "II/2538 — tertiary corridor (obs 1,132 veh/day); WGS84 cut + osm_ref_norm 2538"
    type: "radial"
    geometry_wkt: "LINESTRING (13.669451822656407 50.52375454110119, 13.669514609574696 50.52398618264085)"
    filter:
      link_type: tertiary
      osm_ref_norm: "2538"
    expected_links: 1
    observed_aadt_all: 1132.0

  # CSD — two carriageways I/13+I/27 (trunk), observed 5,734 veh/day (sum of both directions).
  # Short perpendicular cut crosses both parallel trunk links (different osm_id), not link_id.
  - name: "manual_csd_i13_i27_trunk_dual"
    description: "I/13+I/27 — two trunk carriageways (obs 5,734 veh/day); cut + ref 13;27"
    type: "radial"
    geometry_wkt: "LINESTRING (13.653390619379886 50.51193940938457, 13.653524393461035 50.5122079321866)"
    filter:
      link_type: trunk
      osm_ref_norm: "13;27"
    expected_links: 2
    observed_aadt_all: 5734.0
