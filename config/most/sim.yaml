project_path: "project/most_aeq"

osm:
  place_name: "Most, Czechia"

network:
  normalization_config: "config/most/network_normalization.yaml"

assignment:
  bpr:
    by_link_type:
      trunk:      { alpha: 0.50 }
      trunk_link: { alpha: 0.55 }
      primary:    { alpha: 0.65 }
      tertiary:   { alpha: 0.50 }

zoning:
  sources:
    - type: osm
      place: "Okres Most, Czechia"
      admin_level: "9"
  external_gateways:
    enabled: true
    max_anchor_distance_m: 5000
    whitelist:
      - ref: "2541"
        anchor_latlon: [50.5597, 13.5749]
    auto_discover:
      enabled: true
      link_types: []

demand:
  sldb:
    external_processing:
      through_traffic_scale: 0.7
  segments:
    external_local:
      source: "gateway_local"
      total_daily_trips: 15000

calibration:
  match_quality_min: 0.20
  gateway_calibration:
    damping: 0.20
    min_factor: 0.65
    max_factor: 1.40
  odme:
    max_outer_iterations: 40
    stall_patience: 16
    entropy_step_size: 0.15
    convergence_tol: 0.001
    max_iter_change_pct: 10.0
    assign_max_iter: 120
    assign_rgap_target: 0.005
    stages:
      - name: "stabilize"
        max_iterations: 20
        max_deviation: 5.0
        global_residual_damping: 0.12
        max_iter_change_pct: 12.0
        gateway_calibration:
          enabled: true
          damping: 0.12
      - name: "refine"
        max_iterations: 25
        max_deviation: 3.5
        global_residual_damping: 0.18
        max_iter_change_pct: 8.0
  screenlines_path: "config/most/screenlines.yaml"

datasets:
  enabled: true
  sources:
    commuting_sldb2021:
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Most"]
            - field: "op_orp"
              values: ["Most"]
        destination:
          keep_all: true
    calibration_brno_pentlogram_2024:
      enabled: false
    validation_csd2025_v2:
      usage:
        area_filter: { enabled: true, region_hint: "Ústecký kraj" }
