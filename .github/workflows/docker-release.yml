name: Docker Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      city:
        description: "City to build (leave empty for all)"
        required: false
        type: choice
        options:
          - all
          - brno
          - olomouc
          - most
        default: all

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/simulation

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        city: [brno, olomouc, most]

    steps:
      - name: Check if city should be built
        id: guard
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] \
             || [[ "${{ github.event.inputs.city }}" == "all" ]] \
             || [[ "${{ github.event.inputs.city }}" == "${{ matrix.city }}" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip == 'false'

      - name: Restore data sources cache
        if: steps.guard.outputs.skip == 'false'
        id: sources-cache
        uses: actions/cache@v4
        with:
          path: data/sources
          key: data-sources-v1

      - name: Download external data sources
        if: steps.guard.outputs.skip == 'false'
        run: |
          mkdir -p data/sources/csu/sldb2021 \
                   data/sources/cz/places \
                   data/sources/osm

          dl() {
            local url="$1" dest="$2"
            if [ -f "$dest" ]; then
              echo "Cached: $dest ($(stat -c%s "$dest") bytes)"
              return 0
            fi
            echo "Downloading: $url -> $dest"
            curl -fsSL --retry 3 --retry-delay 5 -o "$dest.part" "$url" && mv "$dest.part" "$dest"
          }

          # CSD (V2_CSD2025.xlsx) is committed in the repo — no download needed.

          dl "https://csu.gov.cz/docs/107508/4dbdab3b-905c-deff-4cfa-e4828a6fa2de/dojizdka_obce.csv?version=1.0" \
             data/sources/csu/sldb2021/dojizdka_obce.csv

          dl "https://csu.gov.cz/docs/107508/79c509a0-261c-b4dd-d58d-c05955a24a2c/sldb2021_pohlavi.csv" \
             data/sources/csu/sldb2021/populace_pohlavi.csv

          dl "https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf" \
             data/sources/osm/czech-republic-latest.osm.pbf

          echo "--- data/sources contents ---"
          find data/sources -type f -exec ls -lh {} \;

      - name: Set up Docker Buildx
        if: steps.guard.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.guard.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        if: steps.guard.outputs.skip == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.city }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: steps.guard.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: CITY=${{ matrix.city }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.city }}
          cache-to: type=gha,mode=max,scope=${{ matrix.city }}
