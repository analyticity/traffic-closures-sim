project_path: "project/brno_aeq"

# External gateways and supernetwork: motorways and trunk roads only.
# Corridor details at AOI boundary: see latest gateway_diagnostics.csv in outputs/brno/…
supernetwork:
  # Filtruje LEN auto-objavené brány (whitelist ich obchádza, viď
  # supernetwork/pipeline.py: mask = type_ok | is_whitelist).
  # secondary je tu preto, aby sa správanie nezmenilo, keby sa auto_discover zaplo.
  eligible_gateway_types:
    - motorway
    - motorway_link
    - trunk
    - trunk_link
    - secondary
    - secondary_link

osm:
  place_name: "Brno, Czechia"
  # overpass-api.de má dva A záznamy a opakovane sa stáva, že jeden z nich
  # odmieta spojenie (build padne na `[Errno 111] Connection refused`).
  # AequilibraE ho navyše volá cez plain HTTP (parameters.yml), takže
  # `docker build --add-host` na jeden port nestačí. Endpoint sa preto dá
  # prepnúť tu alebo premennou OVERPASS_ENDPOINT, ktorá má prednosť:
  #
  #     OVERPASS_ENDPOINT=https://maps.mail.ru/osm/tools/overpass/api
  #
  # POZOR pri výbere mirrorov — overené 20. 8. 2026:
  #   maps.mail.ru ....... má české dáta, ale na hromadné dotazy je príliš
  #                        pomalý (osmnx dotaz na okres nedobehol do 10 min)
  #   overpass.osm.ch .... odpovedá rýchlo, ale obsahuje LEN švajčiarske dáta
  #                        — dotaz prejde a vráti 0 featurov, čo je horšie než
  #                        chyba, lebo to vyzerá ako prázdna oblasť
  #   kumi.systems, private.coffee ... vracali 502 / timeout
  # Preto tu ostáva upstream; prepínaj len vedome a výsledok si skontroluj.
  overpass_endpoint: "https://overpass-api.de/api"

network:
  normalization_config: "config/brno/network_normalization.yaml"

zoning:
  # Zóny sa sťahujú z Overpassu; s cache sa to spraví raz a ďalšie behy
  # build-zones sú offline a reprodukovateľné. Zmazať pri zmene `sources`.
  cache_file: "data/brno/cache/zones_osm.gpkg"
  sources:
    # Mestské časti NEČÍTAME cez osmnx. features_from_place() z 29 relácií vráti
    # len 26 — bez varovania vypadne Brno-střed, Brno-Komín a Brno-Chrlice, hoci
    # v OSM majú identické tagy ako zvyšok (type=boundary, place=borough,
    # admin_level=9). Overené na osmnx 2.1.1 tromi variantmi dotazu (okres, mesto,
    # 20x max_query_area_size) — všetky tri vrátia tých istých 26. Brno-střed je
    # najväčší cieľ ciest v modeli, takže tá diera skresľovala všetky radiály.
    # GeoJSON ťahá scripts/fetch_zone_boundaries.py priamo z Overpassu
    # (29 hraníc, spolu 230,2 km² = presná rozloha Brna).
    - type: file
      path: "config/brno/zones_admin9.geojson"
      id_column: "zone_id"
      name_column: "name"
    - type: osm
      place: "Okres Brno-venkov, Czechia"
      admin_level: "9"
  external_gateways:
    enabled: true
    max_anchor_distance_m: 5000
    # II. trieda je v OSM `secondary` — bez rozšírenia tohto zoznamu by
    # select_gateway_target_nodes na nej nenašiel žiadne uzly (default je len
    # motorway/trunk/primary).
    allowed_link_types:
      - motorway
      - motorway_link
      - trunk
      - trunk_link
      - primary
      - primary_link
      - secondary
      - secondary_link
    whitelist:
      - "D1"
      # Main D2 carriageway (~49.124°N); default snap lands on low-flow spur near boundary.
      - ref: "D2"
        anchor_latlon: [49.123847, 16.644072]
      # I/43 sa pri Českej (~49.2865°N) v OSM reálne zužuje z `trunk` 2+2 na
      # `primary` 1+1 (kapacita 3600 -> 1400/pruh). Bez kotvy brána sadne na ten
      # úzky úsek (uzly 15858/15859, 818 a 5 752 voz/deň) a celý externý dopyt
      # sa cez neho nepretlačí — modelovaných 15 118 voz/deň proti 40 582 z CSD.
      # Kotva na 2+2 úseku južne od zúženia.
      - ref: "I/43"
        anchor_latlon: [49.282600, 16.567400]
      # I/52 anchor at ~49.123°N between NB node 158734 and SB node 158735;
      # north of the trunk_link 1147 ramp at node 13769 that bypassed the screenline filter.
      - ref: "I/52"
        anchor_latlon: [49.122980, 16.604120]
      # --- P0-1: radiály, ktoré prekračujú hranicu Brna a doteraz nemali bránu.
      # AADT na hranici okresu Brno-město / Brno-venkov podľa CSD 2025 (v2).
      # POZOR na formát: road_ref_token_variants() rozširuje na holé číslo iba
      # prefixy I/ a D/ (I/50 -> {I50, 50, D50}). Cesty II. a III. triedy sa
      # preto píšu holým číslom tak, ako ich má OSM v tagu `ref`.
      - "I/50"      # východ (Slatina → Šlapanice), 24 271 voz/deň
      - "602"       # II/602, západ (Bosonohy → Troubsko), 18 523
      - "380"       # II/380, juhovýchod (Tuřany → Sokolnice), 12 348
      - "430"       # II/430, východ (Slatina → Šlapanice), 10 115
      # Ďalšie kandidátky (III. trieda, vyžadujú aj `tertiary` v allowed_link_types):
      #   6401  sever, 10 998   |   15286  Šlapanice, 9 977
    auto_discover:
      enabled: false

demand:
  segments:
    external_local:
      # Základ: kamdojizdime.cz (MV ČR), stĺpec pocet_osob_pd (Po–Pá 6–18 h),
      # priemer 4 sezón 2021–2023, typy T2 + T3 + N. Konverzia osoby -> vozidlá:
      # car_share 0.48, occupancy 1.20, 2 cesty/deň.
      #
      # 35 334 zodpovedá MINIMÁLNEJ frekvencii pobytov podľa metodiky INTENS
      # (T2 >=4, T3 >=2, N >=1 pobyt / 28 dní) — je to dolná hranica, nie odhad.
      #
      # 110 000 pochádza zo sweepu (scripts/sweep_demand.py) na opravenom modeli
      # (29 mestských častí, zamestnanosť miest, váhy brán z kamdojizdime) a je
      # to prvá hodnota, ktorá prekonáva pôvodný model vo VŠETKÝCH štyroch
      # holdout metrikách naraz:
      #   R² 0.777 (base 0.627) | sklon 1.005 (0.744)
      #   %RMSE 36.4 (47.0)     | bias 9.3 % (11.8 %)
      # Sklon 1.005 je prakticky presný — celkový objem dopytu sedí.
      #
      # Rozhodla až tretia úroveň porovnania z KAMDOJIZDIME_PLAN.md, teda o koľko
      # musí ODME maticu pokriviť (seed_deviation v calibration_report.json):
      #   110 000 -> drift -12,0 %, 0 buniek nad 4x prahom, max pomer 3.92
      #    90 000 -> drift -28,1 %, 461 buniek nad prahom, max pomer 8.69
      # Lepší holdout teda nie je vyrobený kalibráciou, ale lepším vstupom.
      # (Staršie sweepy dávali iné čísla — bežali s poškodenou seed zálohou,
      # viď commit 6920636. Porovnateľné sú až behy po ňom.)
      #
      # Zostáva výhrada: pri tejto hodnote ODME maticu takmer nemení, takže sa
      # zviditeľnila chyba v rozdelení medzi brány, ktorú predtým prekrývala —
      # D1_E má pomer 0.62, 602_W 0.64. Ladiť treba corridor_weights nižšie,
      # nie tento objem.
      total_daily_trips: 110000
      # Rozdelenie medzi brány. BEZ tohto kľúča ho _normalize_named_weights()
      # odvodí z triedy cesty (_LINK_TYPE_WEIGHT_SCALE: motorway 1.0, trunk 0.9,
      # primary 0.7, secondary 0.4), čo je jediná informácia o veľkosti koridoru,
      # ktorú model inak má — a je hrubá: I43_N tak dostávala 12,1 % dopytu proti
      # reálnym 8,2 % (model/CSD = 1.38), zatiaľ čo D1_E a I52_S dostávali menej,
      # než im patrí (0.69 a 0.65).
      #
      # Váhy nižšie sú z kamdojizdime (T2+T3+N, pocet_osob_pd, priemer 4 sezón),
      # rozpočítané na brány cez external_gateway_lookup.parquet váhami podľa
      # inverznej cesty. Odvodenie: scripts/kamdojizdime_gateway_weights.py
      #
      # Prečo nie z CSD: `external_local` je NEDOCHÁDZKOVÁ externá vrstva, kým
      # CSD sčítanie je všetky vozidlá vrátane tranzitu, takže podiel diaľnic je
      # v ňom nafúknutý. Oba zdroje sa na diaľničných bránach zhodujú do 1–3 p.b.,
      # ale na cestách II. triedy do blízkych obcí dáva kamdojizdime dvoj- až
      # trojnásobok (602_W 15,2 % proti 6,3 %; 430_E 10,0 % proti 4,7 %) — a to je
      # vecne správne, služby a návštevy chodia práve tadiaľ. Druhý dôvod: CSD
      # čísla používajú gateway screenliny na validáciu, takže vážiť nimi seed by
      # znamenalo ladiť model na tie isté dáta, proti ktorým sa meria.
      #
      # Výhrady: napárovalo sa 87,3 % objemu (zvyšné obce nie sú v lookupe) a
      # ~63 % relácií je pod prahom anonymizácie 7 osôb. 380_SE s 1,4 % je
      # najpodozrivejšia hodnota — ak model na 380 začne podstreľovať, začni tam.
      corridor_weights:
        D1_W: 0.1829
        D1_E: 0.1772
        I52_S: 0.1658
        602_W: 0.1524
        D2_S: 0.1368
        430_E: 0.1004
        I43_N: 0.0704
        380_SE: 0.0140
  sldb:
    external_processing:
      through_traffic_scale: 0.30

calibration:
  gateway_calibration:
    damping: 0.08
    min_factor: 0.85
    max_factor: 1.20
  auto_screenlines:
    gateway_count_target: "motor_total"
  odme:
    max_outer_iterations: 48
    entropy_step_size: 0.15
    convergence_tol: 0.0008
    stall_patience: 20
    global_residual_damping: 0.10
    assign_max_iter: 120
    assign_rgap_target: 0.004
    stages:
      - name: "stabilize"
        max_iterations: 20
      - name: "refine"
        max_iterations: 35
  screenlines_path: "config/brno/screenlines.yaml"
  matching:
    require_csd_road_ref_match: true
    # P0-2: ručné vylúčenia zrušené. 7 z 12 pôvodne vylúčených ciest
    # (602, 430, 380, 373, 3846, 41614, 15278) sú hraničné radiály, ktoré do
    # tejto zmeny nemali bránu — model na nich nemohol mať pravdu. Vylúčenie
    # teda maskovalo dôsledok návrhu brán, nie chybu párovania geometrie.
    # Pôvodné hodnoty (pre prípad návratu):
    #   csd_validation_exclude_sil: ["52","602","430","380","37445","41614","15272","385","373"]
    #   exclude_csd_roads: ["3846","386","15272","602","430","380","37445","41614","385","373","15278","15283"]
    csd_validation_exclude_sil: []
    exclude_csd_roads: []

datasets:
  enabled: true
  employment:
    # Zamestnanosť sa odvádza z cieľov dochádzky SLDB, ktoré sú po obciach, takže
    # celé Brno má jeden riadok ("BRNO") a medzi 29 mestských častí sa musí
    # rozpustiť. Bez tohto kľúča sa delí podľa počtu obyvateľov, čo dáva prácu
    # tam, kde sa spí — centrum by dostalo 17,8 % pracovných miest mesta.
    #
    # Súbor je počet pracovísk v OSM (office + shop + zamestnávajúce amenity) na
    # mestskú časť, generuje ho scripts/zone_workplace_weights.py. Centrum tak
    # vychádza na 42,1 %, Královo Pole 11,9 %, Brno-sever 9,1 %.
    #
    # Súbor je počet pracovísk v OSM (office + shop + zamestnávajúce amenity) na
    # mestskú časť, generuje ho scripts/zone_workplace_weights.py. Centrum tak
    # dostane 42,1 % pracovných miest mesta namiesto 17,8 %, ktoré mu dáva
    # populácia — tá dáva prácu tam, kde sa spí.
    #
    # Zmerané A/B, celý reťazec build-demand -> validate, jeden kontajner,
    # menil sa len tento kľúč:
    #                     populačný   POI
    #   holdout R²           0.655    0.685
    #   holdout sklon        0.715    0.794
    #   holdout %RMSE         45.3     43.3
    #   holdout bias          21.0     18.6
    #   drift od seedu      -31.6 %  -30.1 %   (516 vs 425 buniek nad prahom)
    #   screenline max        50.6     67.9
    # POI vyhráva na holdoute aj na drifte; horší screenline je zvyšná chyba
    # v rozdelení medzi brány, ktorú rieši corridor_weights vyššie.
    #
    # VÝHRADA: počet POI berie továreň a kaderníctvo rovnako, takže priemyselné
    # časti sú podhodnotené — Brno-jih má 284 ha priemyslu, ale len 4,4 %
    # pracovísk, Brno-Černovice 159 ha a 1,6 %. Ak model tie dve podstreľuje,
    # začni tu.
    city_split_weights: "config/brno/zone_employment_weights.json"
  sources:
    commuting_sldb2021:
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Brno-město", "Brno-venkov"]
            - field: "op_orp"
              values: ["Brno"]
        destination:
          keep_all: true
    calibration_brno_pentlogram_2024:
      enabled: false
    validation_csd2025_v2:
      usage:
        area_filter: { enabled: true, region_hint: "Jihomoravský kraj" }

baseline_closures:
  enabled: false
  matching:
    max_distance_m: 50
    require_road_ref_match: true
