project_path: "project/brno_aeq"

osm:
  place_name: "Brno, Czechia"

network:
  normalization_config: "config/brno/network_normalization.yaml"
  csd_peak_hour_factor: 0.12

zoning:
  sources:
    - type: osm
      place: "Okres Brno-město, Czechia"
      admin_level: "9"
    - type: osm
      place: "Okres Brno-venkov, Czechia"
      admin_level: "9"
  external_gateways:
    enabled: true

demand:
  segments:
    external_local:
      total_daily_trips: 130000
  distribution:
    blend_alpha: 0.75
    pa_trip_rate: 2.2
    pa_car_share: 0.45
  sldb:
    external_processing:
      through_traffic_scale: 0.30

calibration:
  gateway_calibration:
    damping: 0.26
    min_factor: 0.55
    max_factor: 1.45
  odme:
    max_outer_iterations: 32
    entropy_step_size: 0.22
    convergence_tol: 0.0008
    assign_max_iter: 80
    stages:
      - name: "stabilize"
        max_iterations: 15
      - name: "refine"
        max_iterations: 25
  screenlines_path: "config/brno/screenlines.yaml"

datasets:
  enabled: true
  sources:
    commuting_sldb2021:
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Brno-město", "Brno-venkov"]
            - field: "op_orp"
              values: ["Brno"]
        destination:
          keep_all: true
    calibration_brno_pentlogram_2024:
      enabled: false
    validation_csd2025_v2:
      usage:
        area_filter: { enabled: true, region_hint: "Jihomoravský kraj" }

baseline_closures:
  enabled: true
  matching:
    max_distance_m: 50
    require_road_ref_match: true
