project_path: "project/olomouc_aeq"

osm:
  place_name: "Olomouc, Czechia"

network:
  normalization_config: "config/olomouc/network_normalization.yaml"

# Include secondary gateways (e.g. 446_NW, 448_W) in supernetwork routing and
# external_gateway_lookup. Default eligible_gateway_types omit secondary, so
# auto-discovered secondary corridors were dropped from build-supernetwork.
supernetwork:
  eligible_gateway_types:
    - motorway
    - motorway_link
    - trunk
    - trunk_link
    - primary
    - primary_link
    - secondary
    - secondary_link

zoning:
  sources:
    - type: osm
      place: "Okres Olomouc, Czechia"
      admin_level: "9"
  external_gateways:
    enabled: true
    whitelist: ["D35", "D46", "I/55", "I/46", "I/35", "I/150"]

demand:
  segments:
    external_local:
      # Lower than prior 147466: compact city footprint + okres zoning over-weights corridor seed.
      total_daily_trips: 80000
  sldb:
    external_processing:
      through_traffic_scale: 0.30

calibration:
  gateway_calibration:
    damping: 0.18
    min_factor: 0.70
    max_factor: 1.40
  odme:
    max_outer_iterations: 35
    entropy_step_size: 0.22
    convergence_tol: 0.0008
    stages:
      - name: "stabilize"
        max_iterations: 18
      - name: "refine"
        max_iterations: 28
  screenlines_path: "config/olomouc/screenlines.yaml"
  # Reduce CSD-derived auto screenlines vs. defaults (csd_min_aadt 5000); keeps gateway radials.
  # See docs/olomouc_calibration_diagnostics.md and src/sim/calibration/screenlines.py.
  auto_screenlines:
    csd_min_aadt: 5000

datasets:
  enabled: true
  sources:
    commuting_sldb2021:
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Olomouc"]
            - field: "op_orp"
              values: ["Olomouc"]
        destination:
          keep_all: true
    calibration_brno_pentlogram_2024:
      enabled: false
    validation_csd2025_v2:
      usage:
        area_filter: { enabled: true, region_hint: "Olomoucký kraj" }
