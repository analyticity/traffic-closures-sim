# Screenlines pro Brno — doplňují auto-generované řezy (viz load_screenlines_with_auto).
# Manuální položky se stejným `name` jako auto_* přepíší auto definici.
#
# Lokální řezy: WGS84 kolmice + filter (bez link_id — stabilnější po reimportu OSM).

screenlines:
  - name: "manual_brno_antonin_prochazky_tertiary"
    description: "Antonína Procházky — III/15272 tertiary; pozorované 4 674 voz/den"
    type: radial
    geometry_wkt: "LINESTRING (16.5617027465 49.1940792124, 16.5611579466 49.1933528994)"
    filter:
      link_type: tertiary
      osm_ref_norm: "15272"
    expected_links: 1
    observed_aadt_all: 4674.0

  - name: "manual_brno_tertiary_37915"
