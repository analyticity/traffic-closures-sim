project_path: "project/brno_aeq"
crs_epsg: 5514

osm:
  place_name: "Brno, Czechia"
  buffer_km: 2

network:
  normalization_config: "config/network_normalization.yaml"
  experiment_profile: "baseline"
  output_dir: "outputs/baseline/network"
  maps_dir: "outputs/baseline/maps"
  drivable_network:
    enabled: true
    require_mode_car: true
  isolated_components:
    enabled: true

zoning:
  sources:
    - type: osm
      place: "Okres Brno-město, Czechia"
      admin_level: "9"
    - type: osm
      place: "Okres Brno-venkov, Czechia"
      admin_level: "9"
  cache_file: "data/zones/zones.gpkg"
  output_dir: "outputs/baseline/zones"

  external_gateways:
    enabled: true
    whitelist: ["D1", "D2", "I/43", "I/50", "I/52", "I/23", "I/385", "384", "602"]
    boundary_buffer_m: 1000.0
    min_gateway_separation_m: 800
    max_anchor_distance_m: 2000
    allowed_link_types:
      - motorway
      - motorway_link
      - trunk
      - trunk_link
      - primary
      - primary_link
      - secondary
      - secondary_link
    auto_discover:
      enabled: true
      link_types: ["secondary", "secondary_link"]
      min_lanes: 1
      max_gateways: 30
    export_lookup: true
    export_lookup_path: "data/cache/gateway_lookup_seed.parquet"

supernetwork:
  output_dir: "outputs/baseline/supernetwork"
  cache_dir: "data/cache/supernetwork"
  pbf_path: "data/sources/osm/czech-republic-latest.osm.pbf"
  place_centroids_path: "data/cache/cz_place_centroids.parquet"
  place_centroids_crs_epsg: 4326
  contract_graph: true
  contract_exclude_degree_leq: 2

  national_network:
    highway_types:
      - motorway
      - motorway_link
      - trunk
      - trunk_link
      - primary
      - primary_link
      - secondary
      - secondary_link

  # Only these gateway types participate in national through-traffic routing.
  eligible_gateway_types:
    - motorway
    - motorway_link
    - trunk
    - trunk_link
    - primary
    - primary_link

  relation_filter:
    detour_ratio_max: 1.25
    max_extra_minutes: 18.0
    allow_same_gateway_pair: false

assignment:
  cores: 0

  warm_skim_pass:
    algorithm: "bfw"
    max_iter: 30
    rgap_target: 0.01

  # cost = congested_time + distance * multiplier / vot
  generalized_cost:
    enabled: true
    fixed_cost_field: "distance"
    fixed_cost_multiplier: 0.005
    vot: 1.0

  # BPR volume-delay: t = t0 * (1 + alpha * (V/C)^beta)
  # Alpha/beta calibrated for daily urban model (Horowitz 1991, Tahoe TRPA/WSP).
  # daily_capacity_factor = 1/K where K is peak-hour factor (FHWA / RSD CR).
  bpr:
    vdf_function: "BPR"
    per_link: true
    alpha_default: 0.85
    beta_default: 4.0
    daily_capacity_factor:
      default: 10.0
      by_link_type:
        motorway: 14.0
        motorway_link: 11.1
        trunk: 11.1
        trunk_link: 10.0
        primary: 10.0
        primary_link: 10.0
        secondary: 10.0
        secondary_link: 10.0
        tertiary: 9.1
        tertiary_link: 9.1
        residential: 8.3
        living_street: 8.3
        service: 8.3
        unclassified: 9.1
    by_link_type:
      motorway:       { alpha: 0.45, beta: 4.0 }
      motorway_link:  { alpha: 0.55, beta: 4.0 }
      trunk:          { alpha: 0.85, beta: 5.0 }
      trunk_link:     { alpha: 0.90, beta: 5.0 }
      primary:        { alpha: 0.95, beta: 5.0 }
      primary_link:   { alpha: 1.00, beta: 5.0 }
      secondary:      { alpha: 0.85, beta: 4.0 }
      secondary_link: { alpha: 0.90, beta: 4.0 }
      tertiary:       { alpha: 0.90, beta: 4.0 }
      tertiary_link:  { alpha: 0.90, beta: 4.0 }
      residential:    { alpha: 1.20, beta: 4.0 }
      unclassified:   { alpha: 0.90, beta: 4.0 }
      living_street:  { alpha: 1.50, beta: 4.0 }
      service:        { alpha: 1.50, beta: 4.0 }

  multi_class:
    enabled: true
    classes:
      - name: "local"
        core: "wd_daily_local"
        vot: 1.0
        pce: 1.0
      - name: "through"
        core: "wd_daily_external_through"
        vot: 2.0
        pce: 1.5

demand:
  output_dir: "outputs/baseline/demand"
  matrix_path: "data/demand/od_matrix.aem"
  matrix_name: "demand"

  sldb:
    include_lokalizace:
      - "0_na_adrese_OP"
      - "1_meziobecni"
    only_internal_pairs: false

    external_processing:
      enabled: true
      use_full_cr_dataset: true
      external_gateway_lookup_path: "data/cache/external_gateway_lookup.parquet"
      through_gateway_pairs_path: "data/cache/through_gateway_pairs.parquet"
      use_external_internal: true
      use_internal_external: true
      use_through_traffic: true
      drop_external_external_outside_model: true
      # Scales down supernetwork through-traffic (overestimates distant pairs).
      through_traffic_scale: 0.50
      # Scales SLDB external commuting (registered commuters > actual car trips).
      external_commuting_scale: 0.65

  conversion:
    work:  { car_share: 0.60, occupancy: 1.25, trips_per_person: 2.0 }
    school: { car_share: 0.25, occupancy: 1.30, trips_per_person: 2.0 }

  segments:
    other:
      source: "gravity"
      trip_rate: 1.0
      car_share: 0.35
      occupancy: 1.50
      beta: 0.00030
      defaults:
        trip_rate: 1.0
        car_share: 0.35
        occupancy: 1.50
        beta: 0.00030

    external_local:
      enabled: true
      source: "gateway_local"
      total_daily_trips: 30000
      corridor_weights: {}
      mode: "residual_synthetic"

    external_through:
      enabled: false
      data_driven_pairs_path: "data/cache/through_gateway_pairs.parquet"

  time_slices:
    periods: ["am", "ip", "pm", "ev"]
    weekday:
      work:
        outbound: { am: 0.80, ip: 0.20 }
        return:   { pm: 0.80, ev: 0.20 }
      school:
        outbound: { am: 0.90, ip: 0.10 }
        return:   { pm: 0.70, ev: 0.30 }
    segments:
      other:            { am: 0.25, ip: 0.30, pm: 0.30, ev: 0.15 }
      external_local:   { am: 0.28, ip: 0.22, pm: 0.30, ev: 0.20 }
      external_through: { am: 0.24, ip: 0.28, pm: 0.30, ev: 0.18 }

  temporal_policy:
    weekend_split:
      saturday_multiplier: 1.10
      sunday_multiplier: 0.90
      holiday_multiplier_to_sunday: 0.85
    fallback_day_period_shares: { day: 0.785, evening: 0.137, night: 0.078 }
    demand_period_split_from_day: { am: 0.35, ip: 0.40, pm: 0.25 }

  distribution: { enabled: false }

calibration:
  algorithm: "bfw"
  max_iter: 150
  rgap_target: 0.002
  core_name: "wd_daily"
  model_time_period: "daily"

  # Which observed count source to use for calibration.
  #   "pentlogram" — Brno-specific ArcGIS pentlogram (default).
  #   "csd_split"  — Split CSD data into calibration/validation subsets.
  #                   Use for cities without pentlogram.
  count_source: "csd_split"

  # CSD-split settings (only used when count_source == "csd_split").
  # Both subsets always contain all road classes so calibration can fix
  # inter-class volume imbalances (motorway vs trunk vs secondary etc.).
  csd_split:
    # "alternating" — round-robin within each road number; geographically
    #                 adjacent sections end up in different sets.
    # "stratified"  — random split preserving road_class proportions.
    # "spatial"     — urban sections for calibration, rural for validation.
    #                 Falls back to alternating if all sections are urban/rural.
    strategy: "alternating"
    calib_share: 0.65       # must be in (0, 1)
    random_seed: 42

  gateway_calibration:
    enabled: true
    observed_path: "data/cache/gateway_counts_2025.parquet"
    damping: 0.18
    min_factor: 0.70
    max_factor: 1.40

  match_buffer_m: 50.0
  match_direction_aware: true
  match_conflict_resolution: "nearest"
  count_target: "motor_total"
  aggregate_corridor: true
  save_skims: true
  supply_tuning: { enabled: false }

  max_iterations: 15
  reset_matrix_before_run: true

  convergence:
    geh_lt5_target_pct: 85.0
    min_improvement_pct: -5.0
    daily:
      r2_target: 0.80
      slope_range: [0.85, 1.15]
      pct_rmse_max: 35.0
      screenline_max_pct_deviation: 15.0
      bias_abs_max_pct: 15.0

  scaling:
    enabled: true
    method: "select_link"
    damping: 0.40
    min_factor: 0.50
    max_factor: 2.00

  quality_gates:
    hard_class_bias_max_abs_pct: 90.0
    objective_patience: 5

  screenlines_path: "config/screenlines.yaml"

  odme:
    max_outer_iterations: 20
    gradient_descent_iterations: 3
    max_deviation: 3.0
    weight_function: "inverse_sqrt"
    convergence_tol: 0.001
    global_residual_damping: 0.40

# Datasets
datasets:
  enabled: true
  root_dir: "data/sources"
  cache_dir: "data/cache"
  http:
    timeout_s: 60
    retries: 3
    user_agent: "simulation-pipeline/1.0"

  sources:
    commuting_sldb2021:
      enabled: true
      provider: "csu_open_data_csv"
      url: "https://csu.gov.cz/docs/107508/4dbdab3b-905c-deff-4cfa-e4828a6fa2de/dojizdka_obce.csv?version=1.0"
      out_path: "data/sources/csu/sldb2021/dojizdka_obce.csv"
      filtered_out_parquet: "data/cache/dojizdka_obce.parquet"
      full_cr_out_parquet: "data/cache/dojizdka_obce_full_cr.parquet"
      purposes: ["work", "school"]
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Brno-město", "Brno-venkov"]
            - field: "op_orp"
              values: ["Brno"]
        destination:
          keep_all: true
      preprocess:
        write_filtered: true
        write_full_cr: true

    calibration_brno_pentlogram_2024:
      enabled: true
      provider: "arcgis_feature_service"
      service_url: "https://services6.arcgis.com/fUWVlHWZNxUvTUh8/arcgis/rest/services/intenzita_dopravy_pentlogram_2024/FeatureServer"
      layer_id: 0
      out_path: "data/sources/brno/intensity/intenzita_dopravy_pentlogram_2024.geojson"
      output: { format: "geojson", out_epsg: 5514 }
      units: { car_24_multiplier: 1000, truc_24_multiplier: 1000 }
      query:
        where: "1=1"
        out_fields: ["*"]
        geometry_clip: { enabled: true, use_aoi: true }
      usage:
        calibration_target: "link_counts"

    validation_csd2025_v2:
      enabled: true
      year: 2025
      provider: "http_file"
      url: "https://www.rsd.cz/documents/38144/3734982/V2_CSD_2025.xlsx/50663492-395b-0fd4-f365-d18440997ca5?t=1773922634346"
      out_path: "data/sources/rsd/csd2025/V2_CSD2025.xlsx"
      format: { type: "xlsx" }
      usage:
        validation_target: "aadt_screenlines"
        area_filter: { enabled: true, region_hint: "Jihomoravský kraj" }

    population_sldb2021:
      enabled: true
      provider: "http_file"
      url: "https://csu.gov.cz/docs/107508/79c509a0-261c-b4dd-d58d-c05955a24a2c/sldb2021_pohlavi.csv"
      out_path: "data/sources/csu/sldb2021/populace_pohlavi.csv"
      format: { type: "csv" }
      usage:
        socioeconomic: "population_per_zone"

    cz_place_centroids:
      enabled: true
      provider: "atom_file"
      url: "https://atom.cuzk.gov.cz/get.ashx?theme=RUIAN-CSV-ADR-ST"
      feed_cache_path: "data/sources/cz/places/ruian_csv_adr_st.atom.xml"
      out_path: "data/sources/cz/places/ruian_csv_adr_st.zip"
      out_parquet: "data/cache/cz_place_centroids.parquet"
      format:
        type: "zip_csv"
        asset_pattern: "(?i)(^|/)[0-9]{8}_OB_ADR_csv\\.zip$"
        member_pattern: "(?i)\\.csv$"
        delimiter: ";"
        encoding: "cp1250"
        source_crs_epsg: 2065
        output_crs_epsg: 4326
      columns:
        place_code: "Kód obce"
        place_name: "Název obce"
        x: "Souřadnice X"
        y: "Souřadnice Y"
      usage:
        supernetwork_places: "grouped_point_centroids"

    closures_pg:
      enabled: true
      provider: "postgres_closures"
      table: "restrictions"
      usage:
        calibration_target: "baseline_closures"

    cz_roads_major_pbf:
      enabled: true
      provider: "http_file"
      url: "https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf"
      out_path: "data/sources/osm/czech-republic-latest.osm.pbf"

closures_db:
  host: "REDACTED_HOST"
  port: 5432
  dbname: "traffic"
  user: "admin"
  password: "admin"

baseline_closures:
  enabled: true
  source_path: "data/cache/closures.parquet"
  matching:
    max_distance_m: 150
    require_road_ref_match: false
  severity_map:
    full:           { capacity_factor: 0.05, speed_factor: 0.1 }
    lane_reduction: { capacity_factor: 0.5,  speed_factor: 0.7 }
    speed_limit:    { capacity_factor: 1.0,  speed_factor: 0.5 }
  # Closure periods for different pipeline phases.
  # - measurement_period: applied when building/updating the network (baseline closures).
  # - calibration_period: applied at the start of calibrate (must match count data year).
  #   With count_source "csd_split", use the CSD survey year (2025) for both.
  # - validation_period: used by validate; keep aligned with held-out CSD / reports.
  # After validation, closures are stripped for a clean final assignment.
  measurement_period:   { start: "2025-01-01", end: "2025-12-31" }
  calibration_period: { start: "2025-01-01", end: "2025-12-31" }
  validation_period:  { start: "2025-01-01", end: "2025-12-31" }

api:
  host: "0.0.0.0"
  port: 8000
