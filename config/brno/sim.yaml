project_path: "project/brno_aeq"

osm:
  place_name: "Brno, Czechia"
  buffer_km: 2

network:
  normalization_config: "config/brno/network_normalization.yaml"

zoning:
  sources:
    - type: osm
      place: "Okres Brno-město, Czechia"
      admin_level: "9"
    - type: osm
      place: "Okres Brno-venkov, Czechia"
      admin_level: "9"
  external_gateways:
    enabled: true

demand:
  segments:
    external_local:
      total_daily_trips: "auto"
  distribution:
    blend_alpha: 0.50

calibration:
  rgap_target: 0.002
  count_source: "csd_split"
  method: "entropy_odme"
  odme:
    max_deviation: 3.0
    stall_patience: 5
    stages:
      - name: "stabilize"
        max_iterations: 12
        global_residual_damping: 0.15
        max_iter_change_pct: 8.0
        gateway_calibration:
          enabled: true
          damping: 0.20
      - name: "refine"
        max_iterations: 10
        global_residual_damping: 0.12
        max_iter_change_pct: 5.0
        class_residual_damping: 0.05
  validation:
    match_buffer_m: 120.0
    match_quality_min: 0.25
  csd_split:
    strategy: "corridor"
  screenlines_path: "config/brno/screenlines.yaml"
  auto_screenlines:
    enabled: true
    gateway_screenlines: true
    csd_screenlines: true
    csd_min_aadt: 5000
  journey_time_validation:
    enabled: false  # Requires zone IDs from a built Brno scenario
    reference_routes:
      - name: "D1_west_to_centre"
        from_zone: 0    # fill with zone ID for D1 western gateway
        to_zone: 0       # fill with zone ID for Brno-střed
        reference_time_min: 15
        tolerance_pct: 20
      - name: "D2_south_to_centre"
        from_zone: 0    # fill with zone ID for D2 southern gateway
        to_zone: 0       # fill with zone ID for Brno-střed
        reference_time_min: 12
        tolerance_pct: 20
      - name: "I43_north_to_centre"
        from_zone: 0    # fill with zone ID for I/43 northern gateway
        to_zone: 0       # fill with zone ID for Brno-střed
        reference_time_min: 18
        tolerance_pct: 20
      - name: "Zabovresky_to_Lisen"
        from_zone: 0    # fill with zone ID for Žabovřesky
        to_zone: 0       # fill with zone ID for Líšeň
        reference_time_min: 20
        tolerance_pct: 20
      - name: "Bystrc_to_Slatina"
        from_zone: 0    # fill with zone ID for Bystrc
        to_zone: 0       # fill with zone ID for Slatina
        reference_time_min: 25
        tolerance_pct: 20

datasets:
  enabled: true
  sources:
    commuting_sldb2021:
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Brno-město", "Brno-venkov"]
            - field: "op_orp"
              values: ["Brno"]
        destination:
          keep_all: true
    calibration_brno_pentlogram_2024:
      enabled: false
    validation_csd2025_v2:
      usage:
        area_filter: { enabled: true, region_hint: "Jihomoravský kraj" }

baseline_closures:
  enabled: true
  matching:
    max_distance_m: 50
    require_road_ref_match: true
