project_path: "project/olomouc_aeq"

osm:
  place_name: "Olomouc, Czechia"

network:
  normalization_config: "config/olomouc/network_normalization.yaml"

# Include secondary gateways (e.g. 446_NW, 448_W) in supernetwork routing and
# external_gateway_lookup. Default eligible_gateway_types omit secondary, so
# auto-discovered secondary corridors were dropped from build-supernetwork.
supernetwork:
  eligible_gateway_types:
    - motorway
    - motorway_link
    - trunk
    - trunk_link
    - primary
    - primary_link
    - secondary
    - secondary_link

zoning:
  sources:
    - type: osm
      place: "Okres Olomouc, Czechia"
      admin_level: "9"
  external_gateways:
    enabled: true

demand:
  segments:
    external_local:
      # Lower than prior 147466: compact city footprint + okres zoning over-weights corridor seed.
      total_daily_trips: 80000
  sldb:
    external_processing:
      through_traffic_scale: 0.30

calibration:
  # Small CSD sample — relaxed SL limit (some auto_gw_* gateways exceed 65% error).
  convergence:
    daily:
      pct_rmse_max: 36
      screenline_max_pct_deviation: 100
  gateway_calibration:
    damping: 0.18
    min_factor: 0.70
    max_factor: 1.40
  odme:
    max_outer_iterations: 35
    entropy_step_size: 0.22
    convergence_tol: 0.0008
    stages:
      - name: "stabilize"
        max_iterations: 18
      - name: "refine"
        max_iterations: 28
  screenlines_path: "config/olomouc/screenlines.yaml"
  matching:
    # I/437 secondary link 1905 — CSD ~3k vs model ~9.7k (3.25×); wrong corridor / spur
    exclude_objectids:
      - 8000006
    exclude_csd_roads:
      - "437"
  # Reduce CSD-derived auto screenlines vs. defaults (csd_min_aadt 5000); keeps gateway radials.
  # See src/sim/calibration/screenlines.py.
  auto_screenlines:
    csd_min_aadt: 5000
    # Duplicate / wrong cut on I/46 SW (modeled ~35k vs obs. ~20k, ~75% error);
    # auto_gw_D46_SW is within tolerance, _2 maps different links.
    exclude_gateway_names:
      - "D46_SW_2"
      - "437_E"
    # Ignore auto SL and CSD link matches with ratio outside [below, above]
    # (wrong link / zero flow) in pass/fail and Bias map (status "Excluded").
    exclude_auto_ratio_below: 0.25
    exclude_auto_ratio_above: 4

datasets:
  enabled: true
  sources:
    commuting_sldb2021:
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Olomouc"]
            - field: "op_orp"
              values: ["Olomouc"]
        destination:
          keep_all: true
    calibration_brno_pentlogram_2024:
      enabled: false
    validation_csd2025_v2:
      usage:
        area_filter: { enabled: true, region_hint: "Olomoucký kraj" }
