# Projekt a CRS
project_path: "project/brno_aeq"
crs_epsg: 5514

# OSM zdroj sítě
osm:
  place_name: "Brno, Czechia"

# Síť
network:
  experiment_profile: "motorway_push"
  output_dir: "outputs/baseline/network"
  maps_dir: "outputs/baseline/maps"

# Zónování
zoning:
  sources:
    - place: "Okres Brno-město, Czechia"
      admin_level: "9"
    - place: "Okres Brno-venkov, Czechia"
      admin_level: "9"

  zone_area_filter:
    enabled: true
    rel_factor: 10
    abs_max_km2: 250

  max_connectors: 6
  max_distance_m: 3000
  connector_speed_kmh: 20
  connector_capacity_vph: 2000
  connector_lanes: 1
  connector_access_penalty_s: 300

  cache_file: "data/zones/zones.gpkg"
  output_dir: "outputs/baseline/zones"
  map_dpi: 250

  external_gateways:
    enabled: true
    zone_offset_m: 4000
    zone_size_m: 800
    connectors_per_gateway: 2
    candidate_outer_quantile: 0.90

# OD matice
demand:
  matrix_path: "data/demand/od_matrix.aem"
  matrix_name: "demand"
  output_dir: "outputs/baseline/demand"

  use_gateway_fallback_in_commuting: true

  sldb:
    include_lokalizace: ["0_na_adrese_OP", "1_meziobecni"]
    only_internal_pairs: false

  conversion:
    work:
      car_share: 0.60
      occupancy: 1.25
      trips_per_person: 2.0
    school:
      car_share: 0.25
      occupancy: 1.30
      trips_per_person: 2.0

  gateways:
    - name: "D1_north"
      direction_deg: 340
      angle_range: [300, 20]
    - name: "D2_east"
      direction_deg: 80
      angle_range: [50, 110]
    - name: "D52_south"
      direction_deg: 200
      angle_range: [170, 230]
    - name: "I43_northwest"
      direction_deg: 330
      angle_range: [295, 340]
    - name: "I50_east"
      direction_deg: 90
      angle_range: [60, 120]
    - name: "I41_south"
      direction_deg: 190
      angle_range: [160, 210]
    - name: "I23_west"
      direction_deg: 260
      angle_range: [230, 295]

  segments:
    other:
      source: "gravity"
      trip_rate: 1.5
      car_share: 0.45
      occupancy: 1.40

    external:
      source: "gateway_gravity"
      total_daily_trips: 150000
      through_share: 0.35

  distribution:
    enabled: false

  time_slices:
    periods: ["am", "ip", "pm", "ev"]
    weekday:
      work:
        outbound: {"am": 0.80, "ip": 0.20}
        return: {"pm": 0.80, "ev": 0.20}
      school:
        outbound: {"am": 0.90, "ip": 0.10}
        return: {"pm": 0.70, "ev": 0.30}

# Kalibrace a validace
calibration:
  algorithm: "bfw"
  max_iter: 100
  rgap_target: 0.001
  core_name: "wd_daily"

  match_buffer_m: 50.0
  match_direction_aware: false
  match_conflict_resolution: "nearest"
  count_target: "car_only"
  aggregate_corridor: false
  save_skims: true

  max_iterations: 10
  convergence:
    geh_lt5_target_pct: 85.0
    min_improvement_pct: 0.1

  scaling:
    method: "global"
    damping: 0.3
    min_factor: 0.7
    max_factor: 1.3
    sectors:
      n_sectors: 5

  screenlines_path: "config/screenlines.yaml"

  journey_time_validation:
    enabled: false

  supply_tuning:
    enabled: false

  period_calibration:
    enabled: false

# Datové sady
datasets:
  enabled: true
  root_dir: "data/sources"
  cache_dir: "data/cache"

  aoi:
    use_model_bbox: true
    bbox_epsg: 4326
    target_epsg: 5514

  http:
    timeout_s: 60
    retries: 3
    user_agent: "simulation-pipeline/1.0"

  sources:
    commuting_sldb2021:
      enabled: true
      provider: "csu_open_data_csv"
      url: "https://csu.gov.cz/docs/107508/4dbdab3b-905c-deff-4cfa-e4828a6fa2de/dojizdka_obce.csv?version=1.0"
      out_path: "data/sources/csu/sldb2021/dojizdka_obce.csv"
      format:
        type: "csv"
        delimiter: ","
        encoding: "utf-8"
      purposes: ["work", "school"]
      filter:
        enabled: true
        origin:
          keep_if_any_matches:
            - field: "op_okres"
              values: ["Brno-město", "Brno-venkov"]
            - field: "op_orp"
              values: ["Brno"]
        destination:
          keep_all: true

    calibration_brno_pentlogram_2024:
      enabled: true
      provider: "arcgis_feature_service"
      service_url: "https://services6.arcgis.com/fUWVlHWZNxUvTUh8/arcgis/rest/services/intenzita_dopravy_pentlogram_2024/FeatureServer"
      layer_id: 0
      out_path: "data/sources/brno/intensity/intenzita_dopravy_pentlogram_2024.geojson"
      output:
        format: "geojson"
        out_epsg: 5514
      units:
        car_24_multiplier: 1000
        truc_24_multiplier: 1000
      query:
        where: "1=1"
        out_fields: ["*"]
        geometry_clip:
          enabled: true
          use_aoi: true
      usage:
        calibration_target: "link_counts"

    validation_csd2020_v2:
      enabled: true
      provider: "http_file"
      url: "https://rsd.cz/documents/38144/55309/V2_CSD2020_oprava15122022.xlsx/075ae1be-1a2f-dca0-2789-e76ff80d2694?t=1671525226422"
      out_path: "data/sources/rsd/csd2020/V2_CSD2020.xlsx"
      format:
        type: "xlsx"
      usage:
        validation_target: "aadt_screenlines"
        area_filter:
          enabled: true
          region_hint: "Jihomoravský kraj"

    population_sldb2021:
      enabled: true
      provider: "http_file"
      url: "https://csu.gov.cz/docs/107508/79c509a0-261c-b4dd-d58d-c05955a24a2c/sldb2021_pohlavi.csv"
      out_path: "data/sources/csu/sldb2021/populace_pohlavi.csv"
      format:
        type: "csv"
        delimiter: ","
        encoding: "utf-8"
      usage:
        socioeconomic: "population_per_zone"

# REST API
api:
  host: "0.0.0.0"
  port: 8000
